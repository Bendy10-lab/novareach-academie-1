<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVA REACH ACADÉMIE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;line-height:1.6}
a{color:#6c5ce7;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.hdr{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;padding:12px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hdr-inner{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto;padding:0 16px}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:1px;cursor:pointer}
.logo i{margin-right:6px}
.nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.nav a,.nav span{color:#fff;cursor:pointer;font-size:.9rem;transition:.3s}
.nav a:hover,.nav span:hover{opacity:.8}
.lock-icon{opacity:.55;font-size:1rem;margin-left:8px}
.lock-icon:hover{opacity:1}
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bp{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff}
.bs{background:#e2e8f0;color:#333}
.bg{background:#10b981;color:#fff}
.bd{background:#ef4444;color:#fff}
.bw{background:#f59e0b;color:#fff}
.bi{background:#3b82f6;color:#fff}
.btn-sm{padding:5px 12px;font-size:.78rem}
.fg{margin-bottom:14px}
.fg label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:#555}
.fc{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;transition:.2s}
.fc:focus{outline:none;border-color:#6c5ce7}
select.fc{cursor:pointer}
textarea.fc{resize:vertical;min-height:80px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.card-t{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.scard{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px}
.sicon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.sicon.b{background:#dbeafe;color:#2563eb}
.sicon.g{background:#d1fae5;color:#059669}
.sicon.p{background:#ede9fe;color:#7c3aed}
.sicon.o{background:#fed7aa;color:#ea580c}
.sicon.r{background:#fce7f3;color:#db2777}
.sinfo h3{font-size:1.5rem;font-weight:700}
.sinfo p{color:#718096;font-size:.8rem}
.ccard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.3s;cursor:pointer}
.ccard:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.cthumb{width:100%;height:160px;background:linear-gradient(135deg,#6c5ce7,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.5rem;overflow:hidden}
.cthumb img{width:100%;height:100%;object-fit:cover}
.cinfo{padding:14px}
.ctitle{font-size:1rem;font-weight:700;margin-bottom:4px}
.cteacher{color:#718096;font-size:.8rem;margin-bottom:6px}
.cmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.cprice{font-size:1.1rem;font-weight:700;color:#6c5ce7}
.badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.bf{background:#d1fae5;color:#059669}
.bpa{background:#fed7aa;color:#ea580c}
.sbp{background:#fed7aa;color:#ea580c}
.sba{background:#d1fae5;color:#059669}
.sbr{background:#fee2e2;color:#991b1b}
.sbd{background:#e2e8f0;color:#555}
.sbp2{background:#dbeafe;color:#2563eb}
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:10px 14px;text-align:left;font-weight:600;font-size:.82rem;color:#555;border-bottom:2px solid #e2e8f0}
td{padding:10px 14px;border-bottom:1px solid #f1f1f1;font-size:.85rem}
tr:hover{background:#fafbfc}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:560px;width:92%;max-height:88vh;overflow-y:auto;position:relative}
.modal-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#888}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.9rem;position:fixed;top:70px;right:16px;z-index:9999;min-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.12);animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.alert-s{background:#d1fae5;color:#065f46;border-left:4px solid #10b981}
.alert-e{background:#fee2e2;color:#991b1b;border-left:4px solid #ef4444}
.alert-i{background:#dbeafe;color:#1e40af;border-left:4px solid #3b82f6}
.pbar{width:100%;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin:6px 0}
.pfill{height:100%;background:linear-gradient(90deg,#6c5ce7,#a855f7);transition:width .3s}
.side{width:240px;background:#fff;height:100vh;position:fixed;left:0;top:52px;padding:16px 0;box-shadow:2px 0 10px rgba(0,0,0,.06);overflow-y:auto;z-index:98}
.side ul{list-style:none}
.side li{padding:10px 20px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:10px;font-size:.88rem;border-left:3px solid transparent}
.side li:hover{background:#f8f9ff;color:#6c5ce7}
.side li.act{background:linear-gradient(90deg,#6c5ce7,#a855f7);color:#fff;border-left-color:#fff}
.main{margin-left:240px;padding:20px;min-height:calc(100vh - 52px)}
.notif{padding:12px;border-left:4px solid #6c5ce7;background:#f8f9ff;margin-bottom:8px;border-radius:8px;font-size:.85rem}
.notif.unread{background:#eff6ff;border-left-color:#2563eb}
.stars{display:inline-flex;gap:2px}
.star{cursor:pointer;font-size:1.3rem;color:#e2e8f0;transition:.2s}
.star.on,.star:hover{color:#fbbf24}
.sf{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sf input,.sf select{flex:1;min-width:160px}
.empty{text-align:center;padding:40px 20px;color:#999}
.empty i{font-size:3rem;margin-bottom:12px;opacity:.4}
.cert{background:linear-gradient(135deg,#fefce8,#fffbeb,#fff);border:16px solid #d4af37;border-radius:10px;padding:40px;max-width:800px;margin:20px auto;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.cert::before{content:'';position:absolute;top:-8px;left:-8px;right:-8px;bottom:-8px;border:2px solid #d4af37;border-radius:10px;pointer-events:none}
.cert-h{text-align:center;margin-bottom:24px}
.cert-logo{font-size:1.6rem;font-weight:800;color:#6c5ce7;margin-bottom:8px}
.cert-t{font-size:2rem;font-weight:700;color:#1a1a2e;margin-bottom:6px}
.cert-sub{font-size:1.1rem;color:#666}
.cert-body{text-align:center;margin:24px 0}
.cert-name{font-size:1.8rem;font-weight:700;color:#6c5ce7;margin:12px 0;border-bottom:2px solid #d4af37;display:inline-block;padding-bottom:6px}
.cert-course{font-size:1.3rem;color:#333;margin:10px 0}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:32px;padding-top:20px;border-top:2px solid #d4af37}
.cert-sig{text-align:center;min-width:180px}
.cert-sig-n{font-weight:700;font-size:1rem;margin-bottom:2px}
.cert-sig-t{color:#777;font-size:.8rem}
.cert-id{text-align:center;margin-top:16px;color:#999;font-size:.8rem}
.mob-tog{display:none;background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer}
.lesson-content{max-width:900px;margin:0 auto}
.video-wrap{width:100%;max-width:800px;margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
.video-wrap video,.video-wrap iframe{width:100%;aspect-ratio:16/9;display:block}
.audio-wrap{max-width:600px;margin:20px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.audio-wrap audio{width:100%}
.text-wrap{max-width:800px;margin:0 auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);line-height:1.8;white-space:pre-wrap}
.pdf-wrap{max-width:800px;margin:0 auto;text-align:center}
.pdf-wrap iframe{width:100%;height:600px;border:none;border-radius:10px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e2e8f0;overflow-x:auto}
.tab{padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;font-size:.88rem}
.tab.act{border-bottom-color:#6c5ce7;color:#6c5ce7;font-weight:600}
@media(max-width:768px){
.side{transform:translateX(-100%);transition:.3s;top:0;padding-top:60px}
.side.open{transform:translateX(0)}
.main{margin-left:0;padding:12px}
.grid2,.grid3{grid-template-columns:1fr}
.mob-tog{display:block}
.nav{display:none}
.nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:#6c5ce7;padding:12px;gap:10px}
.cert{padding:20px}
.cert-t{font-size:1.4rem}
.cert-name{font-size:1.2rem}
.cert-foot{flex-direction:column;gap:20px;align-items:center}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==================== DATABASE ====================
const SK='nova_reach_db';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function certId(){return 'NRA-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function affCode(){return 'AFF-'+Math.random().toString(36).slice(2,10).toUpperCase()}

function getDB(){
  let d=localStorage.getItem(SK);
  if(!d){d={users:[],courses:[],lessons:[],enrollments:[],payments:[],paymentProofs:[],withdrawals:[],wallets:[],certificates:[],notifications:[],affiliateLinks:[],affiliateSales:[],reviews:[],questions:[],answers:[],announcements:[],activityLogs:[],refunds:[],settings:{platformName:'NOVA REACH ACADÉMIE',commission:10,currencies:['HTG','USD','EUR'],moncash:{number:'',name:''},natcash:{number:'33461451',name:'Darlene George'},contactEmail:'info@novareach.com'}};localStorage.setItem(SK,JSON.stringify(d))}
  return JSON.parse(d);
}
function saveDB(d){localStorage.setItem(SK,JSON.stringify(d))}
function dbOp(fn){let d=getDB();let r=fn(d);saveDB(d);return r}

// ==================== AUTH ====================
const SESS_KEY='nova_sess';
function setSession(uid2,role){let s={uid:uid2,role,ts:Date.now()};localStorage.setItem(SESS_KEY,JSON.stringify(s));return s}
function getSession(){let s=localStorage.getItem(SESS_KEY);if(!s)return null;try{return JSON.parse(s)}catch{return null}}
function clearSession(){localStorage.removeItem(SESS_KEY)}
function currentUser(){let s=getSession();if(!s)return null;let d=getDB();return d.users.find(u=>u.id===s.uid)||null}
function isAdmin(){let u=currentUser();return u&&u.role==='admin'}
function isTeacher(){let u=currentUser();return u&&u.role==='teacher'}
function isStudent(){let u=currentUser();return u&&u.role==='student'}

// ==================== HELPERS ====================
function alert2(msg,type='s'){let el=document.createElement('div');el.className='alert alert-'+type;el.innerHTML='<i class="fas fa-'+(type==='s'?'check-circle':type==='e'?'exclamation-circle':'info-circle')+'"></i> '+msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
function fmtCur(a,c){let s={HTG:'HTG',USD:'$',EUR:'€'};return c==='USD'||c==='EUR'?(s[c]||c)+' '+a:a+' '+(s[c]||c)}
function fmtDate(d){if(!d)return'-';return new Date(d).toLocaleDateString('fr-FR',{year:'numeric',month:'short',day:'numeric'})}
function fmtDT(d){if(!d)return'-';return new Date(d).toLocaleString('fr-FR')}
function starsH(r){let h='';for(let i=1;i<=5;i++)h+='<i class="fas fa-star star'+(i<=Math.round(r)?' on':'')+'"></i>';return h}
function statusB(s){let m={pending:'sbp',approved:'sba',rejected:'sbr',draft:'sbd',pending_review:'sbp',published:'sba',unpublished:'sbp2',archived:'sbd',active:'sba',suspended:'sbr'};return'<span class="badge '+(m[s]||'sbd')+'">'+s+'</span>'}
function esc(s){if(!s)return'';let d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ==================== ROUTER ====================
function nav(p){window.location.hash=p}
function getRoute(){return window.location.hash.slice(1)||'/'}
function route(){
  let p=getRoute(),u=currentUser();
  if(p.startsWith('/admin')&&p!=='/admin-login'){if(!isAdmin()){nav('/admin-login');return}}
  if(p.startsWith('/student')&&!isStudent()){nav(u?'/login':'/login');return}
  if(p.startsWith('/teacher')&&!isTeacher()){nav(u?'/login':'/login');return}
  render(p);
}
window.addEventListener('hashchange',route);
window.addEventListener('load',route);

// ==================== RENDER ENGINE ====================
function render(p){
  let app=document.getElementById('app');
  let u=currentUser();
  if(p==='/'||p==='')return renderHome(app,u);
  if(p==='/login')return renderLogin(app);
  if(p==='/register')return renderRegister(app);
  if(p==='/admin-login')return renderAdminLogin(app);
  if(p==='/admin')return renderAdmin(app);
  if(p==='/student')return renderStudentDash(app);
  if(p==='/teacher')return renderTeacherDash(app);
  if(p==='/courses')return renderCourses(app,u);
  if(p.startsWith('/course/'))return renderCourseDetail(app,p,u);
  if(p.startsWith('/learn/'))return renderLearn(app,p,u);
  if(p==='/profile')return renderProfile(app,u);
  if(p==='/verify-cert')return renderVerifyCert(app);
  if(p.startsWith('/certificate/'))return renderCertView(app,p,u);
  if(p==='/teacher/create')return renderCreateCourse(app,u);
  if(p.startsWith('/teacher/edit/'))return renderEditCourse(app,p,u);
  if(p.startsWith('/teacher/wallet'))return renderWallet(app,u);
  if(p.startsWith('/teacher/affiliates'))return renderAffiliates(app,u);
  if(p.startsWith('/student/payments'))return renderStudentPayments(app,u);
  if(p.startsWith('/student/certificates'))return renderStudentCerts(app,u);
  if(p.startsWith('/student/notifications'))return renderStudentNotifs(app,u);
  if(p.startsWith('/teacher/notifications'))return renderTeacherNotifs(app,u);
  if(p.startsWith('/payment/'))return renderPaymentPage(app,p,u);
  if(p.startsWith('/teacher/profile/'))return renderPublicProfile(app,p);
  renderHome(app,u);
}

function headerH(u){
  return`<header class="hdr"><div class="hdr-inner"><div class="logo" onclick="nav('/')"><i class="fas fa-graduation-cap"></i>NOVA REACH ACADÉMIE</div><button class="mob-tog" onclick="document.querySelector('.nav').classList.toggle('open')"><i class="fas fa-bars"></i></button><nav class="nav">${u?`<a href="#/${u.role}">Dashboard</a><a href="#/courses">Courses</a><a href="#/profile">Profile</a><a href="#" onclick="doLogout();return false">Logout</a>`:`<a href="#/login">Login</a><a href="#/register">Register</a><a href="#/courses">Courses</a>`}<span class="lock-icon" onclick="nav('/admin-login')" title="Admin"><i class="fas fa-lock"></i></span></nav></div></header>`
}
function doLogout(){clearSession();nav('/');alert2('Déconnecté','s')}

// ==================== HOME ====================
function renderHome(app,u){
  let d=getDB();let courses=d.courses.filter(c=>c.status==='published');
  app.innerHTML=headerH(u)+`<div class="container" style="padding:40px 16px"><div style="text-align:center;padding:40px 0"><h1 style="font-size:2.4rem;margin-bottom:12px;background:linear-gradient(135deg,#6c5ce7,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Bienvenue à NOVA REACH ACADÉMIE</h1><p style="font-size:1.1rem;color:#666;margin-bottom:24px">Transformez votre avenir avec des formations professionnelles en ligne</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a href="#/courses" class="btn bp"><i class="fas fa-search"></i> Parcourir les cours</a>${!u?'<a href="#/register" class="btn bs">S\'inscrire</a>':''}</div></div><h2 style="margin-bottom:16px">Formations disponibles</h2><div class="grid2">${courses.length?courses.slice(0,6).map(c=>courseCardH(c,d)).join(''):'<div class="empty"><i class="fas fa-book-open"></i><p>Aucune formation disponible pour le moment</p></div>'}</div></div>`
}
function courseCardH(c,d){
  let t=d.users.find(u=>u.id===c.teacherId);
  return`<div class="ccard" onclick="nav('/course/${c.id}')"><div class="cthumb">${c.thumbnail?'<img src="'+esc(c.thumbnail)+'">':'<i class="fas fa-play-circle"></i>'}</div><div class="cinfo"><div class="ctitle">${esc(c.title)}</div><div class="cteacher">Par ${t?esc(t.name):'Inconnu'}</div><div style="font-size:.8rem;color:#888;margin-bottom:6px">${esc(c.description||'').slice(0,80)}...</div><div class="cmeta"><span class="cprice">${c.accessType==='free'?'GRATUIT':fmtCur(c.price,c.currency)}</span><span class="badge ${c.accessType==='free'?'bf':'bpa'}">${c.accessType==='free'?'GRATUIT':'PAYANT'}</span></div><div style="margin-top:6px;display:flex;align-items:center;gap:6px"><span class="stars">${starsH(c.rating||0)}</span><span style="font-size:.75rem;color:#999">(${c.studentsCount||0})</span></div></div></div>`
}

// ==================== LOGIN / REGISTER ====================
function renderLogin(app){
  app.innerHTML=headerH(null)+`<div class="container" style="max-width:440px;margin:60px auto"><div class="card"><h2 style="text-align:center;margin-bottom:20px">Connexion</h2><form onsubmit="doLogin(event)"><div class="fg"><label>Email</label><input type="email" class="fc" id="lEmail" required></div><div class="fg"><label>Mot de passe</label><input type="password" class="fc" id="lPass" required></div><button type="submit" class="btn bp" style="width:100%">Se connecter</button></form><p style="text-align:center;margin-top:14px;font-size:.85rem">Pas de compte? <a href="#/register">S'inscrire</a></p></div></div>`
}
function doLogin(e){
  e.preventDefault();
  let email=document.getElementById('lEmail').value.trim(),pass=document.getElementById('lPass').value;
  let r=dbOp(d=>{let u=d.users.find(x=>x.email===email);if(!u)return{err:'Email ou mot de passe incorrect'};if(u.password!==pass)return{err:'Email ou mot de passe incorrect'};if(u.status==='suspended')return{err:'Compte suspendu'};u._id=u.id;u._role=u.role;return{ok:u}});
  if(r.err)return alert2(r.err,'e');
  setSession(r.ok._id,r.ok._role);
  alert2('Connecté avec succès','s');
  nav('/'+r.ok._role);
}
function renderRegister(app){
  app.innerHTML=headerH(null)+`<div class="container" style="max-width:440px;margin:60px auto"><div class="card"><h2 style="text-align:center;margin-bottom:20px">Inscription</h2><form onsubmit="doRegister(event)"><div class="fg"><label>Rôle</label><select class="fc" id="rRole"><option value="student">Étudiant</option><option value="teacher">Formateur</option></select></div><div class="fg"><label>Nom complet</label><input type="text" class="fc" id="rName" required></div><div class="fg"><label>Email</label><input type="email" class="fc" id="rEmail" required></div><div class="fg"><label>Téléphone</label><input type="tel" class="fc" id="rPhone"></div><div class="fg"><label>Mot de passe (min 6)</label><input type="password" class="fc" id="rPass" required minlength="6"></div><button type="submit" class="btn bp" style="width:100%">S'inscrire</button></form><p style="text-align:center;margin-top:14px;font-size:.85rem">Déjà un compte? <a href="#/login">Se connecter</a></p></div></div>`
}
function doRegister(e){
  e.preventDefault();
  let role=document.getElementById('rRole').value,name=document.getElementById('rName').value.trim(),email=document.getElementById('rEmail').value.trim(),phone=document.getElementById('rPhone').value.trim(),pass=document.getElementById('rPass').value;
  let r=dbOp(d=>{if(d.users.find(u=>u.email===email))return{err:'Cet email existe déjà'};let u={id:uid(),role,name,email,password:pass,status:'active',phone,profilePhoto:'',bio:'',createdAt:new Date().toISOString()};d.users.push(u);if(role==='teacher')d.wallets.push({id:uid(),userId:u.id,totalEarned:0,availableBalance:0,pendingBalance:0,totalWithdrawn:0});d.activityLogs.push({id:uid(),userName:name,userRole:role,action:'Inscription',desc:name+' s\'est inscrit(e) comme '+role,timestamp:new Date().toISOString()});u._id=u.id;return{ok:u}});
  if(r.err)return alert2(r.err,'e');
  setSession(r.ok._id,role);
  alert2('Compte créé avec succès','s');
  nav('/'+role);
}

// ==================== ADMIN LOGIN ====================
function renderAdminLogin(app){
  app.innerHTML=headerH(currentUser())+`<div class="container" style="max-width:400px;margin:80px auto"><div class="card"><h2 style="text-align:center;margin-bottom:20px"><i class="fas fa-lock"></i> Accès Admin</h2><form onsubmit="doAdminLogin(event)"><div class="fg"><label>Code d'accès administrateur</label><input type="password" class="fc" id="aCode" required></div><button type="submit" class="btn bp" style="width:100%">Accéder</button></form></div></div>`
}
function doAdminLogin(e){
  e.preventDefault();let code=document.getElementById('aCode').value;
  if(code!=='Bendy509'){return alert2('Accès refusé — Code incorrect','e')}
  let r=dbOp(d=>{let a=d.users.find(u=>u.role==='admin');if(!a){a={id:uid(),role:'admin',name:'Administrateur',email:'admin@novareach.com',password:'__admin__',status:'active',phone:'',profilePhoto:'',bio:'',createdAt:new Date().toISOString()};d.users.push(a)}a._id=a.id;return{ok:a}});
  setSession(r.ok._id,'admin');
  alert2('Accès administrateur autorisé','s');
  nav('/admin');
}

// ==================== COURSES LIST ====================
function renderCourses(app,u){
  let d=getDB();let allC=d.courses.filter(c=>c.status==='published');
  app.innerHTML=headerH(u)+`<div class="container" style="padding:24px 16px"><h2 style="margin-bottom:16px">Toutes les formations</h2><div class="sf"><input type="text" class="fc" id="searchQ" placeholder="Rechercher un cours..." oninput="filterCourses()"><select class="fc" id="fType" onchange="filterCourses()"><option value="">Tous</option><option value="free">Gratuit</option><option value="paid">Payant</option></select><select class="fc" id="fCat" onchange="filterCourses()"><option value="">Catégorie</option><option>Marketing</option><option>Programmation</option><option>Design</option><option>Business</option><option>Langues</option><option>Autre</option></select><select class="fc" id="fSort" onchange="filterCourses()"><option value="newest">Plus récent</option><option value="oldest">Plus ancien</option><option value="low">Prix croissant</option><option value="high">Prix décroissant</option><option value="rated">Mieux noté</option></select><select class="fc" id="fCur" onchange="filterCourses()"><option value="">Devise</option><option>HTG</option><option>USD</option><option>EUR</option></select></div><div class="grid2" id="coursesGrid">${allC.map(c=>courseCardH(c,d)).join('')||'<div class="empty"><i class="fas fa-search"></i><p>Aucun cours trouvé</p></div>'}</div></div>`
}
window.filterCourses=function(){
  let q=(document.getElementById('searchQ').value||'').toLowerCase(),type=document.getElementById('fType').value,cat=document.getElementById('fCat').value,sort=document.getElementById('fSort').value,cur=document.getElementById('fCur').value;
  let d=getDB();let cs=d.courses.filter(c=>c.status==='published');
  if(q)cs=cs.filter(c=>c.title.toLowerCase().includes(q)||(c.description||'').toLowerCase().includes(q)||(d.users.find(u=>u.id===c.teacherId)||{}).name?.toLowerCase().includes(q));
  if(type)cs=cs.filter(c=>c.accessType===type);
  if(cat)cs=cs.filter(c=>(c.category||'')===cat);
  if(cur)cs=cs.filter(c=>c.currency===cur);
  if(sort==='newest')cs.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(sort==='oldest')cs.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if(sort==='low')cs.sort((a,b)=>(a.price||0)-(b.price||0));
  if(sort==='high')cs.sort((a,b)=>(b.price||0)-(a.price||0));
  if(sort==='rated')cs.sort((a,b)=>(b.rating||0)-(a.rating||0));
  document.getElementById('coursesGrid').innerHTML=cs.length?cs.map(c=>courseCardH(c,d)).join(''):'<div class="empty"><i class="fas fa-search"></i><p>Aucun cours trouvé</p></div>';
}

// ==================== COURSE DETAIL ====================
function renderCourseDetail(app,p,u){
  let cid=p.split('/')[2];let d=getDB();let c=d.courses.find(x=>x.id===cid);
  if(!c){app.innerHTML=headerH(u)+'<div class="container" style="padding:40px"><div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Cours introuvable</p></div></div>';return}
  let t=d.users.find(x=>x.id===c.teacherId);
  let lessons=d.lessons.filter(l=>l.courseId===cid);
  let enrolled=u&&u.role==='student'?d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid):null;
  let canAccess=enrolled||c.accessType==='free';
  let reviews=d.reviews.filter(r=>r.courseId===cid);
  let questions=d.questions.filter(q=>q.courseId===cid);
  
  let accessBtn='';
  if(!u)accessBtn=`<a href="#/login" class="btn bp" style="width:100%">Connectez-vous pour accéder</a>`;
  else if(u.role==='student'){
    if(c.accessType==='free'&&!enrolled){
      accessBtn=`<button class="btn bg" style="width:100%" onclick="enrollFree('${cid}')">Accéder au cours (Gratuit)</button>`;
    }else if(c.accessType==='paid'&&!enrolled){
      accessBtn=`<a href="#/payment/${cid}" class="btn bp" style="width:100%">Acheter — ${fmtCur(c.price,c.currency)}</a>`;
    }else if(enrolled){
      accessBtn=`<a href="#/learn/${cid}" class="btn bg" style="width:100%">Accéder au cours</a>`;
    }
  }else if(u.role==='teacher'&&u.id===c.teacherId){
    accessBtn=`<a href="#/teacher/edit/${cid}" class="btn bw" style="width:100%">Modifier le cours</a>`;
  }

  app.innerHTML=headerH(u)+`<div class="container" style="padding:24px 16px"><div class="card"><div style="display:grid;grid-template-columns:1fr 320px;gap:24px" class="course-detail-grid"><div><h1 style="font-size:1.6rem;margin-bottom:8px">${esc(c.title)}</h1><p style="color:#666;margin-bottom:12px">${esc(c.description)}</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px"><span class="badge ${c.accessType==='free'?'bf':'bpa'}">${c.accessType==='free'?'GRATUIT':'PAYANT'}</span><span class="badge sbd">${esc(c.category||'Non classé')}</span><span class="badge sbd">${esc(c.currency)}</span>${statusB(c.status)}</div><p style="font-size:.9rem">Par <a href="#/teacher/profile/${c.teacherId}">${t?esc(t.name):'Inconnu'}</a></p><div style="margin-top:8px"><span class="stars">${starsH(c.rating||0)}</span> <span style="font-size:.85rem;color:#888">(${reviews.length} avis, ${c.studentsCount||0} étudiants)</span></div><h3 style="margin:20px 0 12px">Programme (${lessons.length} leçons)</h3>${lessons.map((l,i)=>{let locked=c.accessType==='paid'&&!canAccess&&!l.isPreview;return`<div style="padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center"><div><strong>${i+1}. ${esc(l.title)}</strong> <span class="badge sbd" style="margin-left:6px">${l.type.toUpperCase()}</span>${l.isPreview?'<span class="badge bf" style="margin-left:4px">PREVIEW</span>':''}</div><div>${locked?'<i class="fas fa-lock" style="color:#ccc"></i>':'<i class="fas fa-'+(l.type==='video'?'play-circle':l.type==='audio'?'headphones':l.type==='pdf'?'file-pdf':'align-left')+'" style="color:#6c5ce7"></i>'}</div></div>`}).join('')||'<p style="color:#999">Aucune leçon</p>'}</div><div><div class="card" style="position:sticky;top:70px"><div style="text-align:center;margin-bottom:16px"><div style="font-size:2rem;font-weight:700;color:#6c5ce7">${c.accessType==='free'?'GRATUIT':fmtCur(c.price,c.currency)}</div></div>${accessBtn}${c.accessType==='paid'&&c.paymentInfo?`<div style="margin-top:12px;font-size:.8rem;color:#666"><p><strong>MonCash:</strong> ${esc(c.paymentInfo.moncash||'Non disponible')}</p><p><strong>NatCash:</strong> 33461451 (Darlene George)</p></div>`:''}</div></div></div></div>${reviews.length?`<div class="card"><h3 class="card-t">Avis</h3>${reviews.map(r=>{let s=d.users.find(x=>x.id===r.studentId);return`<div style="padding:10px;border-bottom:1px solid #f0f0f0"><div style="display:flex;justify-content:space-between"><strong>${s?esc(s.name):'Anonyme'}</strong><span class="stars">${starsH(r.rating)}</span></div><p style="margin-top:4px;font-size:.88rem">${esc(r.text)}</p><small style="color:#999">${fmtDate(r.createdAt)}</small></div>`}).join('')}</div>`:''}<div class="card"><h3 class="card-t">Questions & Réponses</h3><div id="qaList">${questions.map(q=>{let s=d.users.find(x=>x.id===q.studentId);let ans=d.answers.filter(a=>a.questionId===q.id);return`<div style="padding:10px;border-bottom:1px solid #f0f0f0"><strong>${s?esc(s.name):'Anonyme'}</strong>: ${esc(q.text)}<small style="color:#999;margin-left:8px">${fmtDate(q.createdAt)}</small>${ans.map(a=>{let au=d.users.find(x=>x.id===a.userId);return`<div style="margin-left:20px;margin-top:6px;padding:6px;background:#f8f9ff;border-radius:6px"><strong>${au?esc(au.name):''}</strong>: ${esc(a.text)}</div>`}).join('')}</div>`}).join('')||'<p style="color:#999">Aucune question</p>'}</div>${u&&u.role==='student'&&canAccess?`<form onsubmit="askQ(event,'${cid}')" style="margin-top:12px"><div class="fg"><input type="text" class="fc" id="qText" placeholder="Posez votre question..." required></div><button class="btn bp btn-sm">Poser</button></form>`:''}</div></div><style>.course-detail-grid{grid-template-columns:1fr 320px}@media(max-width:768px){.course-detail-grid{grid-template-columns:1fr!important}}</style>`
}
window.enrollFree=function(cid){
  let u=currentUser();if(!u)return;
  let r=dbOp(d=>{if(d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid))return{err:'Déjà inscrit'};d.enrollments.push({id:uid(),studentId:u.id,courseId:cid,progress:0,completedLessons:[],lastLessonId:null,completed:false,enrolledAt:new Date().toISOString()});let c=d.courses.find(x=>x.id===cid);if(c)c.studentsCount=(c.studentsCount||0)+1;return{ok:true}});
  if(r.err)return alert2(r.err,'e');
  alert2('Inscription réussie!','s');nav('/learn/'+cid);
}
window.askQ=function(e,cid){
  e.preventDefault();let u=currentUser();if(!u)return;
  let txt=document.getElementById('qText').value.trim();if(!txt)return;
  dbOp(d=>{d.questions.push({id:uid(),courseId:cid,studentId:u.id,text:txt,createdAt:new Date().toISOString()})});
  alert2('Question posée','s');renderCourseDetail(document.getElementById('app'),'/course/'+cid,u);
}

function renderPaymentPage(app,p,u){
  if(!u||u.role!=='student'){nav('/login');return}
  let cid=p.split('/')[2];let d=getDB();let c=d.courses.find(x=>x.id===cid);
  if(!c){nav('/courses');return}
  let settings=d.settings;
  app.innerHTML=headerH(u)+`<div class="container" style="max-width:520px;margin:40px auto"><div class="card"><h2 style="text-align:center;margin-bottom:16px">Paiement — ${esc(c.title)}</h2><div style="text-align:center;margin-bottom:20px"><span style="font-size:1.8rem;font-weight:700;color:#6c5ce7">${fmtCur(c.price,c.currency)}</span></div><form onsubmit="submitPayment(event,'${cid}')"><div class="fg"><label>Méthode de paiement</label><select class="fc" id="payMethod" onchange="showPayInfo()"><option value="MONCASH">MonCash</option><option value="NATCASH">NatCash</option></select></div><div id="payInfo" class="card" style="background:#f8f9ff;border:1px solid #e0e0e0"><p><strong>Paiement par MonCash</strong></p><p>Numéro: ${esc(settings.moncash?.number||'Non disponible')}</p><p>Nom: ${esc(settings.moncash?.name||'Non disponible')}</p></div><div class="fg"><label>Montant payé</label><input type="number" class="fc" id="payAmt" value="${c.price}" required min="1"></div><div class="fg"><label>ID de transaction / Référence</label><input type="text" class="fc" id="payTxn" required></div><div class="fg"><label>Preuve de paiement (URL image ou description)</label><input type="text" class="fc" id="payProof" placeholder="Lien vers l'image ou description"></div><button type="submit" class="btn bp" style="width:100%">Soumettre le paiement</button></form></div></div>`
}
window.showPayInfo=function(){
  let m=document.getElementById('payMethod').value;let d=getDB();let s=d.settings;
  let info=m==='NATCASH'?`<p><strong>Paiement par NatCash</strong></p><p>Numéro: 33461451</p><p>Nom: Darlene George</p>`:`<p><strong>Paiement par MonCash</strong></p><p>Numéro: ${esc(s.moncash?.number||'Non disponible')}</p><p>Nom: ${esc(s.moncash?.name||'Non disponible')}</p>`;
  document.getElementById('payInfo').innerHTML=info;
}
window.submitPayment=function(e,cid){
  e.preventDefault();let u=currentUser();
  let method=document.getElementById('payMethod').value,amt=parseFloat(document.getElementById('payAmt').value),txn=document.getElementById('payTxn').value.trim(),proof=document.getElementById('payProof').value.trim();
  let d=getDB();let c=d.courses.find(x=>x.id===cid);
  if(d.payments.find(p=>p.transactionId===txn)){return alert2('Cet ID de transaction existe déjà','e')}
  dbOp(d=>{
    let pay={id:uid(),studentId:u.id,courseId:cid,amount:amt,currency:c.currency,method,transactionId:txn,proof,status:'pending',createdAt:new Date().toISOString()};
    d.payments.push(pay);
    d.notifications.push({id:uid(),userId:u.id,type:'payment_submitted',title:'Paiement soumis',message:'Votre paiement pour "'+c.title+'" est en attente de vérification',read:false,createdAt:new Date().toISOString()});
    let admins=d.users.filter(x=>x.role==='admin');
    admins.forEach(a=>{d.notifications.push({id:uid(),userId:a.id,type:'payment_submitted',title:'Nouveau paiement',message:u.name+' a soumis un paiement pour "'+c.title+'"',read:false,createdAt:new Date().toISOString()})});
    d.activityLogs.push({id:uid(),userName:u.name,userRole:'student',action:'Paiement soumis',desc:'Paiement de '+amt+' '+c.currency+' pour '+c.title,timestamp:new Date().toISOString()});
  });
  alert2('Paiement soumis avec succès. En attente de vérification.','s');
  nav('/student');
}

// ==================== LEARN / LESSON VIEWER ====================
function renderLearn(app,p,u){
  if(!u||u.role!=='student'){nav('/login');return}
  let cid=p.split('/')[2];let d=getDB();let c=d.courses.find(x=>x.id===cid);
  let enr=d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid);
  if(!c){nav('/student');return}
  if(c.accessType==='paid'&&!enr){nav('/course/'+cid);return}
  if(c.accessType==='free'&&!enr){
    dbOp(d2=>{d2.enrollments.push({id:uid(),studentId:u.id,courseId:cid,progress:0,completedLessons:[],lastLessonId:null,completed:false,enrolledAt:new Date().toISOString()});let cc=d2.courses.find(x=>x.id===cid);if(cc)cc.studentsCount=(cc.studentsCount||0)+1});
    enr=dbOp(d2=>d2.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid));
  }
  let lessons=d.lessons.filter(l=>l.courseId===cid);
  if(!lessons.length){app.innerHTML=headerH(u)+'<div class="container" style="padding:40px"><div class="empty"><i class="fas fa-book"></i><p>Aucune leçon disponible</p></div></div>';return}
  let currentL=enr.lastLessonId?lessons.find(l=>l.id===enr.lastLessonId):lessons[0];
  if(!currentL)currentL=lessons[0];
  let pct=lessons.length?Math.round((enr.completedLessons.length/lessons.length)*100):0;

  app.innerHTML=headerH(u)+`<div style="display:flex;min-height:calc(100vh - 52px)"><div style="width:280px;background:#fff;border-right:1px solid #eee;overflow-y:auto;padding:12px" class="lesson-side"><h3 style="font-size:.95rem;margin-bottom:8px">${esc(c.title)}</h3><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><p style="font-size:.75rem;color:#888;margin-bottom:12px">${enr.completedLessons.length}/${lessons.length} leçons (${pct}%)</p>${lessons.map((l,i)=>{let done=enr.completedLessons.includes(l.id);let active=currentL.id===l.id;return`<div onclick="loadLesson('${l.id}','${cid}')" style="padding:8px;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:.82rem;${active?'background:#6c5ce7;color:#fff':'background:'+(done?'#f0fdf4':'#f9f9f9')}"><i class="fas fa-${done?'check-circle':'circle'}" style="margin-right:6px"></i>${i+1}. ${esc(l.title)} <span style="font-size:.7rem;opacity:.7">${l.type.toUpperCase()}</span></div>`}).join('')}</div><div style="flex:1;padding:20px;overflow-y:auto" id="lessonArea">${renderLessonContent(currentL,enr)}</div></div><style>.lesson-side{position:fixed;top:52px;left:0;bottom:0;z-index:50}@media(max-width:768px){.lesson-side{width:100%;position:relative;top:0;border-right:none;border-bottom:1px solid #eee;max-height:200px}}</style>`
}
function renderLessonContent(l,enr){
  let done=enr.completedLessons.includes(l.id);
  let content='';
  if(l.type==='video')content=`<div class="video-wrap">${l.content.includes('youtube')||l.content.includes('youtu.be')?`<iframe src="${l.content.includes('embed')?l.content:l.content.replace('watch?v=','embed/')}" frameborder="0" allowfullscreen></iframe>`:`<video controls src="${esc(l.content)}">Votre navigateur ne supporte pas la vidéo</video>`}</div>`;
  else if(l.type==='audio')content=`<div class="audio-wrap"><h3 style="margin-bottom:12px"><i class="fas fa-headphones"></i> ${esc(l.title)}</h3><audio controls src="${esc(l.content)}">Votre navigateur ne supporte pas l'audio</audio></div>`;
  else if(l.type==='text')content=`<div class="text-wrap">${esc(l.content)}</div>`;
  else if(l.type==='pdf')content=`<div class="pdf-wrap"><h3 style="margin-bottom:12px"><i class="fas fa-file-pdf" style="color:#e74c3c"></i> ${esc(l.title)}</h3><iframe src="${esc(l.content)}"></iframe><br><a href="${esc(l.content)}" target="_blank" class="btn bs btn-sm" style="margin-top:8px"><i class="fas fa-download"></i> Télécharger</a></div>`;
  return`<div class="lesson-content"><h2 style="margin-bottom:16px">${esc(l.title)} <span class="badge sbd">${l.type.toUpperCase()}</span></h2>${content}<div style="margin-top:20px;display:flex;gap:12px;align-items:center">${done?'<span style="color:#10b981;font-weight:600"><i class="fas fa-check-circle"></i> Complétée</span>':`<button class="btn bg" onclick="markDone('${l.id}','${l.courseId}')"><i class="fas fa-check"></i> Marquer comme complétée</button>`}</div></div>`
}
window.loadLesson=function(lid,cid){
  let u=currentUser();let d=getDB();let l=d.lessons.find(x=>x.id===lid);let enr=d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid);
  if(!l||!enr)return;
  dbOp(d2=>{let e=d2.enrollments.find(x=>x.id===enr.id);if(e)e.lastLessonId=lid});
  document.getElementById('lessonArea').innerHTML=renderLessonContent(l,enr);
  document.querySelectorAll('.lesson-side > div').forEach(el=>{el.style.background=el.getAttribute('onclick')?.includes(lid)?'#6c5ce7':'';if(el.getAttribute('onclick')?.includes(lid))el.style.color='#fff'});
}
window.markDone=function(lid,cid){
  let u=currentUser();
  let r=dbOp(d=>{
    let enr=d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid);
    if(!enr)return{err:'Non inscrit'};
    if(!enr.completedLessons.includes(lid))enr.completedLessons.push(lid);
    let lessons=d.lessons.filter(l=>l.courseId===cid);
    enr.progress=Math.round((enr.completedLessons.length/lessons.length)*100);
    if(enr.completedLessons.length>=lessons.length&&!enr.completed){
      enr.completed=true;
      let c=d.courses.find(x=>x.id===cid);let s=d.users.find(x=>x.id===u.id);
      let cert={id:uid(),certificateId:certId(),studentId:u.id,courseId:cid,studentName:s?s.name:'',courseName:c?c.title:'',issuedAt:new Date().toISOString()};
      d.certificates.push(cert);
      d.notifications.push({id:uid(),userId:u.id,type:'certificate',title:'Certificat obtenu!',message:'Félicitations! Vous avez terminé "'+cert.courseName+'". Votre certificat est disponible.',read:false,createdAt:new Date().toISOString()});
      if(c)d.notifications.push({id:uid(),userId:c.teacherId,type:'course_completed',title:'Cours terminé',message:u.name+' a terminé "'+c.title+'"',read:false,createdAt:new Date().toISOString()});
    }
    enr.lastLessonId=lid;
    return{ok:true,completed:enr.completed}
  });
  if(r.err)return alert2(r.err,'e');
  alert2(r.completed?'Félicitations! Cours terminé! 🎉':'Leçon complétée!','s');
  renderLearn(document.getElementById('app'),'/learn/'+cid,u);
}

// ==================== STUDENT DASHBOARD ====================
function renderStudentDash(app){
  let u=currentUser();let d=getDB();
  let enrs=d.enrollments.filter(e=>e.studentId===u.id);
  let notifs=d.notifications.filter(n=>n.userId===u.id);
  let unread=notifs.filter(n=>!n.read).length;
  let certs=d.certificates.filter(c=>c.studentId===u.id);
  let payments=d.payments.filter(p=>p.studentId===u.id);

ted&&!d.reviews.find(r=>r.studentId===u.id&&r.courseId===c.id)?`<button class="btn bs btn-sm" onclick="showReviewModal('${c.id}')">Noter</button>`:''}</div></div></div>`}).join(''):'<div class="empty"><i class="fas fa-book-open"></i><p>Aucun cours. <a href="#/courses">Parcourir les formations</a></p></div>'}</div></div><div class="modal-bg" id="reviewModal"><div class="modal"><button class="modal-x" onclick="closeModal('reviewModal')">&times;</button><h3>Laisser un avis</h3><form onsubmit="submitReview(event)"><input type="hidden" id="revCid"><div class="fg"><label>Note</label><div class="stars" id="revStars">${[1,2,3,4,5].map(i=>`<i class="fas fa-star star" data-v="${i}" onclick="setRating(${i})"></i>`).join('')}</div><input type="hidden" id="revRating" value="0"></div><div class="fg"><label>Commentaire</label><textarea class="fc" id="revText" required></textarea></div><button class="btn bp" type="submit">Soumettre</button></form></div></div>`

x;justify-content:space-between;align-items:center"><div><strong>${i+1}. ${esc(l.title)}</strong> <span class="badge sbd">${l.type.toUpperCase()}</span>${l.isPreview?' <span class="badge bf">Preview</span>':''}</div><button class="btn bd btn-sm" onclick="deleteLesson('${l.id}','${cid}')"><i class="fas fa-trash"></i></button></div>`).join('')||'<p style="color:#999">Aucune leçon</p>'}</div><div class="card" style="margin-top:16px;background:#f8f9ff"><h4 style="margin-bottom:12px">Ajouter une leçon</h4><div class="fg"><label>Titre</label><input type="text" class="fc" id="lTitle"></div><div class="fg"><label>Type</label><select class="fc" id="lType" onchange="toggleLContent()"><option value="video">Vidéo</option><option value="audio">Audio</option><option value="text">Texte</option><option value="pdf">PDF</option></select></div><div class="fg" id="lContentWrap"><label id="lContentLabel">URL Vidéo</label><textarea class="fc" id="lContent" placeholder="URL ou contenu..."></textarea></div><div class="fg"><label><input type="checkbox" id="lPreview"> Aperçu gratuit (Preview)</label></div><button class="btn bg" onclick="addLesson('${cid}')"><i class="fas fa-plus"></i> Ajouter</button></div><hr style="margin:24px 0"><div style="display:flex;gap:8px;flex-wrap:wrap">${c.status==='draft'||c.status==='rejected'?`<button class="btn bw" onclick="submitCourse('${cid}')">Soumettre pour révision</button>`:''}${c.status==='published'?`<span class="badge sba">Publié</span>`:''}${statusB(c.status)}</div></div></div>`

window.toggleLContent=function(){
  let t=document.getElementById('lType').value;
  let labels={video:'URL Vidéo (ou lien YouTube)',audio:'URL Audio',text:'Contenu texte',pdf:'URL du PDF'};
  let ph={video:'https://www.youtube.com/watch?v=... ou URL fichier',audio:'https://...mp3',text:'Écrivez votre leçon ici...',pdf:'https://...pdf'};
  document.getElementById('lContentLabel').textContent=labels[t];
  document.getElementById('lContent').placeholder=ph[t];
}
window.addLesson=function(cid){
  let title=document.getElementById('lTitle').value.trim(),type=document.getElementById('lType').value,content=document.getElementById('lContent').value.trim(),preview=document.getElementById('lPreview').checked;
  if(!title||!content)return alert2('Remplissez tous les champs','e');
  dbOp(d=>{d.lessons.push({id:uid(),courseId:cid,title,type,content,isPreview:preview,createdAt:new Date().toISOString()})});
  alert2('Leçon ajoutée!','s');renderEditCourse(document.getElementById('app'),'/teacher/edit/'+cid,currentUser());
}
window.deleteLesson=function(lid,cid){
  if(!confirm('Supprimer cette leçon?'))return;
  dbOp(d=>{d.lessons=d.lessons.filter(l=>l.id!==lid)});
  alert2('Leçon supprimée','s');renderEditCourse(document.getElementById('app'),'/teacher/edit/'+cid,currentUser());
}
window.saveCourse=function(e,cid){
  e.preventDefault();let u=currentUser();
  let title=document.getElementById('cTitle').value.trim(),desc=document.getElementById('cDesc').value.trim(),cat=document.getElementById('cCat').value,thumb=document.getElementById('cThumb').value.trim(),access=document.getElementById('cAccess').value,price=parseFloat(document.getElementById('cPrice').value)||0,cur=document.getElementById('cCur').value;
  if(access==='paid'&&price<=0)return alert2('Un cours payant doit avoir un prix > 0','e');
  if(cid){
    dbOp(d=>{let c=d.courses.find(x=>x.id===cid);if(c){Object.assign(c,{title,description:desc,category:cat,thumbnail:thumb,accessType:access,price,currency:cur})}});
    alert2('Cours mis à jour!','s');
  }else{
    let r=dbOp(d=>{let c={id:uid(),teacherId:u.id,title,description:desc,category:cat,thumbnail:thumb,accessType:access,price,currency:cur,status:'draft',rating:0,studentsCount:0,createdAt:new Date().toISOString()};d.courses.push(c);d.activityLogs.push({id:uid(),userName:u.name,userRole:'teacher',action:'Cours créé',desc:u.name+' a créé "'+title+'"',timestamp:new Date().toISOString()});c._id=c.id;return{ok:c}});
    cid=r.ok._id;alert2('Cours créé!','s');
  }
  nav('/teacher/edit/'+cid);
}
window.submitCourse=function(cid){
  let d=getDB();let c=d.courses.find(x=>x.id===cid);
  let lessons=d.lessons.filter(l=>l.courseId===cid);
  if(!lessons.length)return alert2('Ajoutez au moins une leçon avant de soumettre','e');
  if(c.accessType==='paid'&&(!c.price||c.price<=0))return alert2('Définissez un prix valide','e');
  dbOp(d=>{let cc=d.courses.find(x=>x.id===cid);if(cc)cc.status='pending_review'});
  alert2('Cours soumis pour révision!','s');
  renderEditCourse(document.getElementById('app'),'/teacher/edit/'+cid,currentUser());
}

  let wds=d.withdrawals.filter(x=>x.teacherId===u.id);

}
window.reqWithdrawal=function(e){
  e.preventDefault();let u=currentUser();let amt=parseFloat(document.getElementById('wdAmt').value),method=document.getElementById('wdMethod').value,num=document.getElementById('wdNum').value.trim();
  let r=dbOp(d=>{let w=d.wallets.find(x=>x.userId===u.id);if(!w||w.availableBalance<amt)return{err:'Solde insuffisant'};w.availableBalance-=amt;w.pendingBalance+=amt;d.withdrawals.push({id:uid(),teacherId:u.id,amount:amt,method,number:num,status:'pending',createdAt:new Date().toISOString()});d.activityLogs.push({id:uid(),userName:u.name,userRole:'teacher',action:'Retrait demandé',desc:u.name+' a demandé un retrait de '+amt,timestamp:new Date().toISOString()});let admins=d.users.filter(x=>x.role==='admin');admins.forEach(a=>{d.notifications.push({id:uid(),userId:a.id,type:'withdrawal',title:'Nouveau retrait',message:u.name+' demande un retrait de '+amt,read:false,createdAt:new Date().toISOString()})});return{ok:true}});
  if(r.err)return alert2(r.err,'e');
  alert2('Demande de retrait soumise!','s');renderWallet(document.getElementById('app'),u);
}

// ==================== CERTIFICATE VIEW ====================
function renderCertView(app,p,u){
  let cid=p.split('/')[2];let d=getDB();
  let cert=d.certificates.find(c=>c.courseId===cid&&u&&c.studentId===u.id);
  if(!cert){
    cert=d.certificates.find(c=>c.courseId===cid);
  }
  if(!cert){app.innerHTML=headerH(u)+'<div class="container" style="padding:40px"><div class="empty"><i class="fas fa-certificate"></i><p>Certificat introuvable</p></div></div>';return}
  app.innerHTML=headerH(u)+`<div class="container" style="padding:24px 16px">${certHTML(cert)}<div style="text-align:center;margin-top:16px"><a href="#/verify-cert" class="btn bs btn-sm">Vérifier un certificat</a></div></div>`
}
function certHTML(cert){
  return`<div class="cert"><div class="cert-h"><div class="cert-logo"><i class="fas fa-graduation-cap"></i> NOVA REACH ACADÉMIE</div><div class="cert-t">Certificat de Réussite</div><div class="cert-sub">Ce certificat est fièrement décerné à</div></div><div class="cert-body"><div class="cert-name">${esc(cert.studentName)}</div><p style="font-size:1rem;margin:12px 0">pour avoir complété avec succès la formation</p><div class="cert-course">"${esc(cert.courseName)}"</div><p style="margin-top:12px;color:#666">Date de complétion: ${fmtDate(cert.issuedAt)}</p></div><div class="cert-foot"><div class="cert-sig"><div style="border-top:2px solid #333;padding-top:6px;margin-bottom:4px;min-width:160px"></div><div class="cert-sig-n">${esc(cert.studentName)}</div><div class="cert-sig-t">Étudiant(e)</div></div><div class="cert-sig"><div style="border-top:2px solid #333;padding-top:6px;margin-bottom:4px;min-width:160px"></div><div class="cert-sig-n">BENÊCHE JURGENS</div><div class="cert-sig-t">PDG / Signature</div></div></div><div class="cert-id">ID du Certificat: ${cert.certificateId} | NOVA REACH ACADÉMIE</div></div>`
}

function renderVerifyCert(app){
  let u=currentUser();
  app.innerHTML=headerH(u)+`<div class="container" style="max-width:500px;margin:60px auto"><div class="card"><h2 style="text-align:center;margin-bottom:20px"><i class="fas fa-shield-alt"></i> Vérification de Certificat</h2><form onsubmit="verifyCert(event)"><div class="fg"><label>ID du Certificat</label><input type="text" class="fc" id="vCertId" placeholder="NRA-XXXXX-XXXXXX" required></div><button type="submit" class="btn bp" style="width:100%">Vérifier</button></form><div id="vResult" style="margin-top:16px"></div></div></div>`
}
window.verifyCert=function(e){
  e.preventDefault();let cid=document.getElementById('vCertId').value.trim();
  let d=getDB();let cert=d.certificates.find(c=>c.certificateId===cid);
  let res=document.getElementById('vResult');
  if(cert){
    res.innerHTML=`<div class="alert alert-s" style="position:static"><i class="fas fa-check-circle"></i> CERTIFICAT VALIDE ✅</div><div class="card"><p><strong>Étudiant:</strong> ${esc(cert.studentName)}</p><p><strong>Formation:</strong> ${esc(cert.courseName)}</p><p><strong>Date:</strong> ${fmtDate(cert.issuedAt)}</p><p><strong>Académie:</strong> NOVA REACH ACADÉMIE</p></div>`;
  }else{
    res.innerHTML=`<div class="alert alert-e" style="position:static"><i class="fas fa-times-circle"></i> CERTIFICAT NON TROUVÉ / INVALIDE</div>`;
  }
}

function renderProfile(app,u){
  if(!u){nav('/login');return}
  app.innerHTML=headerH(u)+`<div class="container" style="max-width:600px;margin:24px auto"><div class="card"><h2 class="card-t">Mon Profil</h2><form onsubmit="updateProfile(event)"><div class="fg"><label>Photo (URL)</label><input type="text" class="fc" id="pPhoto" value="${esc(u.profilePhoto||'')}"></div><div class="fg"><label>Nom complet</label><input type="text" class="fc" id="pName" value="${esc(u.name)}" required></div><div class="fg"><label>Email</label><input type="email" class="fc" value="${esc(u.email)}" disabled></div><div class="fg"><label>Téléphone</label><input type="tel" class="fc" id="pPhone" value="${esc(u.phone||'')}"></div><div class="fg"><label>Bio</label><textarea class="fc" id="pBio">${esc(u.bio||'')}</textarea></div><div class="fg"><label>Statut</label><input type="text" class="fc" value="${u.status}" disabled></div><div class="fg"><label>Membre depuis</label><input type="text" class="fc" value="${fmtDate(u.createdAt)}" disabled></div><button type="submit" class="btn bp">Sauvegarder</button></form><hr style="margin:20px 0"><h3>Changer le mot de passe</h3><form onsubmit="changePass(event)"><div class="fg"><label>Mot de passe actuel</label><input type="password" class="fc" id="cpOld" required></div><div class="fg"><label>Nouveau mot de passe</label><input type="password" class="fc" id="cpNew" required minlength="6"></div><button type="submit" class="btn bw">Changer</button></form></div></div>`
}
window.updateProfile=function(e){
  e.preventDefault();let u=currentUser();
  let name=document.getElementById('pName').value.trim(),phone=document.getElementById('pPhone').value.trim(),bio=document.getElementById('pBio').value.trim(),photo=document.getElementById('pPhoto').value.trim();
  dbOp(d=>{let uu=d.users.find(x=>x.id===u.id);if(uu){uu.name=name;uu.phone=phone;uu.bio=bio;uu.profilePhoto=photo}});
  alert2('Profil mis à jour!','s');renderProfile(document.getElementById('app'),currentUser());
}
window.changePass=function(e){
  e.preventDefault();let u=currentUser();let old=document.getElementById('cpOld').value,nw=document.getElementById('cpNew').value;
  let r=dbOp(d=>{let uu=d.users.find(x=>x.id===u.id);if(!uu)return{err:'Erreur'};if(uu.password!==old)return{err:'Mot de passe actuel incorrect'};uu.password=nw;return{ok:true}});
  if(r.err)return alert2(r.err,'e');
  alert2('Mot de passe changé!','s');
}
function renderPublicProfile(app,p){
  let tid=p.split('/')[3];let d=getDB();let t=d.users.find(u=>u.id===tid);
  if(!t){app.innerHTML=headerH(currentUser())+'<div class="container" style="padding:40px"><div class="empty">Profil introuvable</div></div>';return}
  let courses=d.courses.filter(c=>c.teacherId===tid&&c.status==='published');
  let reviews=d.reviews.filter(r=>courses.some(c=>c.id===r.courseId));
  let u=currentUser();
  app.innerHTML=headerH(u)+`<div class="container" style="max-width:800px;margin:24px auto"><div class="card" style="text-align:center"><div style="width:80px;height:80px;border-radius:50%;background:#6c5ce7;color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 12px">${t.profilePhoto?'<img src="'+esc(t.profilePhoto)+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':t.name[0].toUpperCase()}</div><h2>${esc(t.name)}</h2><p style="color:#888">${esc(t.bio||'Formateur')}</p><div style="display:flex;gap:20px;justify-content:center;margin-top:12px"><span><strong>${courses.length}</strong> cours</span><span><strong>${courses.reduce((s,c)=>s+(c.studentsCount||0),0)}</strong> étudiants</span><span><strong>${reviews.length}</strong> avis</span></div></div><h3 style="margin:16px 0">Formations</h3><div class="grid2">${courses.map(c=>courseCardH(c,d)).join('')||'<p style="color:#999">Aucune formation publiée</p>'}</div></div>`
}

window.adminTab=function(el,tab){
  document.querySelectorAll('.side li').forEach(l=>l.classList.remove('act'));el.classList.add('act');
  if(tab==='dash')adminLoadDash();
  else if(tab==='students')adminLoadStudents();
  else if(tab==='teachers')adminLoadTeachers();
  else if(tab==='courses')adminLoadCourses();
  else if(tab==='payments')adminLoadPayments();
  else if(tab==='withdrawals')adminLoadWithdrawals();
  else if(tab==='affiliates')adminLoadAffiliates();
  else if(tab==='certs')adminLoadCerts();
  else if(tab==='reviews')adminLoadReviews();
  else if(tab==='notifs')adminLoadAdminNotifs();
  else if(tab==='announce')adminLoadAnnounce();
  else if(tab==='logs')adminLoadLogs();
  else if(tab==='settings')adminLoadSettings();
  document.querySelector('.side')?.classList.remove('open');
}

rts.length}</h3><p>Certificats</p></div></div></div><div class="card"><h3 class="card-t">Activité récente</h3><div class="tbl-wrap"><table><thead><tr><th>Action</th><th>Utilisateur</th><th>Date</th></tr></thead><tbody>${d.activityLogs.slice(0,10).map(l=>`<tr><td>${esc(l.action)}</td><td>${esc(l.userName||'Système')}</td><td>${fmtDT(l.timestamp)}</td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center">Aucune activité</td></tr>'}</tbody></table></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bs btn-sm" onclick="exportBackup()"><i class="fas fa-download"></i> Exporter Backup</button><label class="btn bs btn-sm" style="cursor:pointer"><i class="fas fa-upload"></i> Importer Backup<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label></div>`

function adminLoadPayments(){
  let d=getDB();let m=document.getElementById('adminMain');let pays=d.payments;
  m.innerHTML=`<h1 style="margin-bottom:16px">Paiements & Preuves</h1><div class="tbl-wrap"><table><thead><tr><th>Étudiant</th><th>Cours</th><th>Montant</th><th>Méthode</th><th>Transaction</th><th>Preuve</th><th>Statut</th><th>Date</th><th>Actions</th></tr></thead><tbody>${pays.length?pays.map(p=>{let s=d.users.find(u=>u.id===p.studentId);let c=d.courses.find(u=>u.id===p.courseId);return`<tr><td>${s?esc(s.name):'-'}</td><td>${c?esc(c.title):'-'}</td><td>${fmtCur(p.amount,p.currency)}</td><td>${p.method}</td><td><code style="font-size:.75rem">${esc(p.transactionId)}</code></td><td>${p.proof?'<a href="'+esc(p.proof)+'" target="_blank" class="btn bs btn-sm">Voir</a>':'-'}</td><td>${statusB(p.status)}</td><td>${fmtDate(p.createdAt)}</td><td>${p.status==='pending'?`<button class="btn bg btn-sm" onclick="approvePay('${p.id}')">Approuver</button> <button class="btn bd btn-sm" onclick="rejectPay('${p.id}')">Rejeter</button>`:'-'}</td></tr>`}).join(''):'<tr><td colspan="9" style="text-align:center;color:#999">Aucun paiement</td></tr>'}</tbody></table></div>`
}
window.approvePay=function(pid){
  dbOp(d=>{
    let p=d.payments.find(x=>x.id===pid);if(!p||p.status!=='pending')return;
    p.status='approved';
    let c=d.courses.find(x=>x.id===p.courseId);
    if(c&&!d.enrollments.find(e=>e.studentId===p.studentId&&e.courseId===p.courseId)){
      d.enrollments.push({id:uid(),studentId:p.studentId,courseId:p.courseId,progress:0,completedLessons:[],lastLessonId:null,completed:false,enrolledAt:new Date().toISOString()});
      c.studentsCount=(c.studentsCount||0)+1;
    }
    let settings=d.settings;let fee=(p.amount*(settings.commission||10))/100;let earning=p.amount-fee;
    if(c){let w=d.wallets.find(x=>x.userId===c.teacherId);if(w){w.totalEarned+=earning;w.availableBalance+=earning}}
    // Affiliate
    let affSale=d.affiliateSales.find(s=>s.paymentId===p.id);
    if(!affSale){
      let link=d.affiliateLinks.find(l=>l.courseId===p.courseId&&l.active);
      if(link){let comm=(p.amount*link.rate)/100;link.salesCount=(link.salesCount||0)+1;link.totalCommission+=comm;d.affiliateSales.push({id:uid(),linkId:link.id,paymentId:p.id,courseId:p.courseId,amount:p.amount,commission:comm,status:'approved',createdAt:new Date().toISOString()});if(c)d.notifications.push({id:uid(),userId:c.teacherId,type:'affiliate_sale',title:'Vente affiliée!',message:'Nouvelle vente affiliée pour "'+c.title+'" — Commission: '+fmtCur(comm,p.currency),read:false,createdAt:new Date().toISOString()})}
    }
    d.notifications.push({id:uid(),userId:p.studentId,type:'payment_approved',title:'Paiement approuvé ✅',message:'Votre paiement pour "'+(c?c.title:'')+'" a été approuvé. Accès accordé!',read:false,createdAt:new Date().toISOString()});
    if(c)d.notifications.push({id:uid(),userId:c.teacherId,type:'payment_received',title:'Nouveau paiement',message:'Paiement reçu pour "'+c.title+'" — '+fmtCur(earning,p.currency),read:false,createdAt:new Date().toISOString()});
    d.activityLogs.push({id:uid(),userName:'Admin',userRole:'admin',action:'Paiement approuvé',desc:'Paiement de '+p.amount+' '+p.currency+' approuvé',timestamp:new Date().toISOString()});
  });
  alert2('Paiement approuvé!','s');adminLoadPayments();
}
window.rejectPay=function(pid){
  dbOp(d=>{
    let p=d.payments.find(x=>x.id===pid);if(!p||p.status!=='pending')return;p.status='rejected';
    let c=d.courses.find(x=>x.id===p.courseId);
    d.notifications.push({id:uid(),userId:p.studentId,type:'payment_rejected',title:'Paiement rejeté ❌',message:'Votre paiement pour "'+(c?c.title:'')+'" a été rejeté.',read:false,createdAt:new Date().toISOString()});
    d.activityLogs.push({id:uid(),userName:'Admin',userRole:'admin',action:'Paiement rejeté',desc:'Paiement de '+p.amount+' rejeté',timestamp:new Date().toISOString()});
  });
  alert2('Paiement rejeté','s');adminLoadPayments();
}
function adminLoadWithdrawals(){
  let d=getDB();let m=document.getElementById('adminMain');let wds=d.withdrawals;
  m.innerHTML=`<h1 style="margin-bottom:16px">Retraits</h1><div class="tbl-wrap"><table><thead><tr><th>Formateur</th><th>Montant</th><th>Méthode</th><th>Numéro</th><th>Statut</th><th>Date</th><th>Actions</th></tr></thead><tbody>${wds.length?wds.map(w=>{let t=d.users.find(u=>u.id===w.teacherId);return`<tr><td>${t?esc(t.name):'-'}</td><td>${fmtCur(w.amount,'USD')}</td><td>${w.method}</td><td>${esc(w.number)}</td><td>${statusB(w.status)}</td><td>${fmtDate(w.createdAt)}</td><td>${w.status==='pending'?`<button class="btn bg btn-sm" onclick="approveWd('${w.id}')">Approuver</button> <button class="btn bd btn-sm" onclick="rejectWd('${w.id}')">Rejeter</button>`:'-'}</td></tr>`}).join(''):'<tr><td colspan="7" style="text-align:center;color:#999">Aucun retrait</td></tr>'}</tbody></table></div>`
}
window.approveWd=function(wid){dbOp(d=>{let w=d.withdrawals.find(x=>x.id===wid);if(!w)return;w.status='approved';let wallet=d.wallets.find(x=>x.userId===w.teacherId);if(wallet){wallet.pendingBalance-=w.amount;wallet.totalWithdrawn+=w.amount}d.notifications.push({id:uid(),userId:w.teacherId,type:'withdrawal_approved',title:'Retrait approuvé',message:'Votre retrait de '+fmtCur(w.amount,'USD')+' a été approuvé',read:false,createdAt:new Date().toISOString()});d.activityLogs.push({id:uid(),userName:'Admin',userRole:'admin',action:'Retrait approuvé',desc:'Retrait de '+w.amount+' approuvé',timestamp:new Date().toISOString()})});alert2('Approuvé','s');adminLoadWithdrawals()}
window.rejectWd=function(wid){dbOp(d=>{let w=d.withdrawals.find(x=>x.id===wid);if(!w)return;w.status='rejected';let wallet=d.wallets.find(x=>x.userId===w.teacherId);if(wallet){wallet.pendingBalance-=w.amount;wallet.availableBalance+=w.amount}d.notifications.push({id:uid(),userId:w.teacherId,type:'withdrawal_rejected',title:'Retrait rejeté',message:'Votre retrait de '+fmtCur(w.amount,'USD')+' a été rejeté',read:false,createdAt:new Date().toISOString()});d.activityLogs.push({id:uid(),userName:'Admin',userRole:'admin',action:'Retrait rejeté',desc:'Retrait de '+w.amount+' rejeté',timestamp:new Date().toISOString()})});alert2('Rejeté','s');adminLoadWithdrawals()}
function adminLoadAffiliates(){
  let d=getDB();let m=document.getElementById('adminMain');let links=d.affiliateLinks;let sales=d.affiliateSales;
  m.innerHTML=`<h1 style="margin-bottom:16px">Affiliations</h1><div class="tbl-wrap"><table><thead><tr><th>Formateur</th><th>Cours</th><th>Code</th><th>Commission</th><th>Ventes</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${links.length?links.map(l=>{let t=d.users.find(u=>u.id===l.teacherId);let c=d.courses.find(u=>u.id===l.courseId);return`<tr><td>${t?esc(t.name):'-'}</td><td>${c?esc(c.title):'-'}</td><td><code>${l.code}</code></td><td>${l.rate}%</td><td>${l.salesCount||0}</td><td>${l.active?'<span class="badge sba">Actif</span>':'<span class="badge sbr">Désactivé</span>'}</td><td><button class="btn bs btn-sm" onclick="toggleAff('${l.id}')">${l.active?'Désactiver':'Activer'}</button></td></tr>`}).join(''):'<tr><td colspan="7" style="text-align:center;color:#999">Aucune affiliation</td></tr>'}</tbody></table></div>`
}
window.toggleAff=function(lid){dbOp(d=>{let l=d.affiliateLinks.find(x=>x.id===lid);if(l)l.active=!l.active});alert2('Mis à jour','s');adminLoadAffiliates()}
function adminLoadCerts(){
  let d=getDB();let m=document.getElementById('adminMain');let certs=d.certificates;
  m.innerHTML=`<h1 style="margin-bottom:16px">Certificats</h1><div class="tbl-wrap"><table><thead><tr><th>Étudiant</th><th>Formation</th><th>ID Certificat</th><th>Date</th><th>Actions</th></tr></thead><tbody>${certs.length?certs.map(c=>`<tr><td>${esc(c.studentName)}</td><td>${esc(c.courseName)}</td><td><code>${c.certificateId}</code></td><td>${fmtDate(c.issuedAt)}</td><td><a href="#/certificate/${c.courseId}" class="btn bs btn-sm">Voir</a></td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:#999">Aucun certificat</td></tr>'}</tbody></table></div>`
}
function adminLoadReviews(){
  let d=getDB();let m=document.getElementById('adminMain');
  m.innerHTML=`<h1 style="margin-bottom:16px">Avis</h1><div class="tbl-wrap"><table><thead><tr><th>Étudiant</th><th>Cours</th><th>Note</th><th>Commentaire</th><th>Date</th><th>Actions</th></tr></thead><tbody>${d.reviews.length?d.reviews.map(r=>{let s=d.users.find(u=>u.id===r.studentId);let c=d.courses.find(u=>u.id===r.courseId);return`<tr><td>${s?esc(s.name):'-'}</td><td>${c?esc(c.title):'-'}</td><td>${starsH(r.rating)}</td><td>${esc(r.text)}</td><td>${fmtDate(r.createdAt)}</td><td><button class="btn bd btn-sm" onclick="delReview('${r.id}')">Supprimer</button></td></tr>`}).join(''):'<tr><td colspan="6" style="text-align:center;color:#999">Aucun avis</td></tr>'}</tbody></table></div>`
}
window.delReview=function(rid){if(!confirm('Supprimer?'))return;dbOp(d=>{let r=d.reviews.find(x=>x.id===rid);if(r){d.reviews=d.reviews.filter(x=>x.id!==rid);let revs=d.reviews.filter(x=>x.courseId===r.courseId);let c=d.courses.find(x=>x.id===r.courseId);if(c)c.rating=revs.length?Math.round((revs.reduce((s,x)=>s+x.rating,0)/revs.length)*10)/10:0}});alert2('Supprimé','s');adminLoadReviews()}
function adminLoadAdminNotifs(){
  let u=currentUser();let d=getDB();let m=document.getElementById('adminMain');let notifs=d.notifications.filter(n=>n.userId===u.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  m.innerHTML=`<h1 style="margin-bottom:16px">Notifications Admin</h1><div style="margin-bottom:12px"><button class="btn bs btn-sm" onclick="markAllRead();adminLoadAdminNotifs()">Tout marquer lu</button></div>${notifs.length?notifs.map(n=>`<div class="notif ${n.read?'':'unread'}"><strong>${esc(n.title)}</strong><p style="font-size:.85rem">${esc(n.message)}</p><small style="color:#999">${fmtDT(n.createdAt)}</small></div>`).join(''):'<div class="empty"><i class="fas fa-bell-slash"></i><p>Aucune notification</p></div>'}`
}
function adminLoadAnnounce(){
  let m=document.getElementById('adminMain');
  m.innerHTML=`<h1 style="margin-bottom:16px">Annonces</h1><div class="card"><h3 class="card-t">Nouvelle annonce</h3><form onsubmit="sendAnnounce(event)"><div class="fg"><label>Titre</label><input type="text" class="fc" id="annTitle" required></div><div class="fg"><label>Message</label><textarea class="fc" id="annMsg" required></textarea></div><div class="fg"><label>Audience</label><select class="fc" id="annAud"><option value="all">Tous</option><option value="student">Étudiants</option><option value="teacher">Formateurs</option></select></div><button class="btn bp" type="submit">Envoyer</button></form></div>`
}
window.sendAnnounce=function(e){
  e.preventDefault();let title=document.getElementById('annTitle').value.trim(),msg=document.getElementById('annMsg').value.trim(),aud=document.getElementById('annAud').value;
  dbOp(d=>{
    d.announcements.push({id:uid(),title,message:msg,audience:aud,createdAt:new Date().toISOString()});
    let targets=aud==='all'?d.users:d.users.filter(u=>u.role===aud);
    targets.forEach(u=>{d.notifications.push({id:uid(),userId:u.id,type:'announcement',title,message:msg,read:false,createdAt:new Date().toISOString()})});
    d.activityLogs.push({id:uid(),userName:'Admin',userRole:'admin',action:'Annonce envoyée',desc:title+' ('+aud+')',timestamp:new Date().toISOString()});
  });
  alert2('Annonce envoyée!','s');adminLoadAnnounce();
}
function adminLoadLogs(){
  let d=getDB();let m=document.getElementById('adminMain');
  m.innerHTML=`<h1 style="margin-bottom:16px">Journaux d'activité</h1><div class="tbl-wrap"><table><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Action</th><th>Description</th><th>Date</th></tr></thead><tbody>${d.activityLogs.length?d.activityLogs.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).map(l=>`<tr><td>${esc(l.userName||'-')}</td><td><span class="badge sbd">${l.userRole||'-'}</span></td><td>${esc(l.action)}</td><td>${esc(l.desc)}</td><td>${fmtDT(l.timestamp)}</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:#999">Aucun journal</td></tr>'}</tbody></table></div>`
}
function adminLoadSettings(){
  let d=getDB();let s=d.settings;let m=document.getElementById('adminMain');
  m.innerHTML=`<h1 style="margin-bottom:16px">Paramètres</h1><div class="card"><form onsubmit="saveSettings(event)"><div class="fg"><label>Nom de la plateforme</label><input type="text" class="fc" id="sName" value="${esc(s.platformName)}"></div><div class="fg"><label>Commission plateforme (%)</label><input type="number" class="fc" id="sComm" value="${s.commission}" min="0" max="100"></div><div class="fg"><label>Email de contact</label><input type="text" class="fc" id="sEmail" value="${esc(s.contactEmail||'')}"></div><h3 style="margin:16px 0 8px">MonCash</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="fg"><label>Numéro</label><input type="text" class="fc" id="sMcNum" value="${esc(s.moncash?.number||'')}"></div><div class="fg"><label>Nom</label><input type="text" class="fc" id="sMcName" value="${esc(s.moncash?.name||'')}"></div></div><h3 style="margin:16px 0 8px">NatCash</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="fg"><label>Numéro</label><input type="text" class="fc" value="33461451" disabled></div><div class="fg"><label>Nom</label><input type="text" class="fc" value="Darlene George" disabled></div></div><button class="btn bp" type="submit">Sauvegarder</button></form></div>`
}
window.saveSettings=function(e){
  e.preventDefault();
  dbOp(d=>{d.settings.platformName=document.getElementById('sName').value.trim();d.settings.commission=parseFloat(document.getElementById('sComm').value)||10;d.settings.contactEmail=document.getElementById('sEmail').value.trim();d.settings.moncash={number:document.getElementById('sMcNum').value.trim(),name:document.getElementById('sMcName').value.trim()}});
  alert2('Paramètres sauvegardés!','s');
}
window.exportBackup=function(){let d=getDB();let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nova-reach-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();alert2('Backup exporté!','s')}
window.importBackup=function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){try{let data=JSON.parse(ev.target.result);if(!data.users||!data.courses)throw new Error();saveDB(data);alert2('Backup importé!','s');route()}catch{alert2('Fichier invalide','e')}};r.readAsText(f)}
</script>
