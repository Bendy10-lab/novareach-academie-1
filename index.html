<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVA REACH ACADÉMIE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;line-height:1.6}
a{color:#6c5ce7;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.hdr{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff;padding:12px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hdr-inner{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto;padding:0 16px}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:1px;cursor:pointer}
.logo i{margin-right:6px}
.nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.nav a,.nav span{color:#fff;cursor:pointer;font-size:.9rem;transition:.3s}
.nav a:hover,.nav span:hover{opacity:.8}
.lock-icon{opacity:.55;font-size:1rem;margin-left:8px}
.lock-icon:hover{opacity:1}
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bp{background:linear-gradient(135deg,#6c5ce7,#a855f7);color:#fff}
.bs{background:#e2e8f0;color:#333}
.bg{background:#10b981;color:#fff}
.bd{background:#ef4444;color:#fff}
.bw{background:#f59e0b;color:#fff}
.bi{background:#3b82f6;color:#fff}
.btn-sm{padding:5px 12px;font-size:.78rem}
.fg{margin-bottom:14px}
.fg label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:#555}
.fc{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;transition:.2s}
.fc:focus{outline:none;border-color:#6c5ce7}
select.fc{cursor:pointer}
textarea.fc{resize:vertical;min-height:80px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.card-t{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.scard{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px}
.sicon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.sicon.b{background:#dbeafe;color:#2563eb}
.sicon.g{background:#d1fae5;color:#059669}
.sicon.p{background:#ede9fe;color:#7c3aed}
.sicon.o{background:#fed7aa;color:#ea580c}
.sicon.r{background:#fce7f3;color:#db2777}
.sinfo h3{font-size:1.5rem;font-weight:700}
.sinfo p{color:#718096;font-size:.8rem}
.ccard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.3s;cursor:pointer}
.ccard:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.cthumb{width:100%;height:160px;background:linear-gradient(135deg,#6c5ce7,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.5rem;overflow:hidden}
.cthumb img{width:100%;height:100%;object-fit:cover}
.cinfo{padding:14px}
.ctitle{font-size:1rem;font-weight:700;margin-bottom:4px}
.cteacher{color:#718096;font-size:.8rem;margin-bottom:6px}
.cmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.cprice{font-size:1.1rem;font-weight:700;color:#6c5ce7}
.badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.bf{background:#d1fae5;color:#059669}
.bpa{background:#fed7aa;color:#ea580c}
.sbp{background:#fed7aa;color:#ea580c}
.sba{background:#d1fae5;color:#059669}
.sbr{background:#fee2e2;color:#991b1b}
.sbd{background:#e2e8f0;color:#555}
.sbp2{background:#dbeafe;color:#2563eb}
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:10px 14px;text-align:left;font-weight:600;font-size:.82rem;color:#555;border-bottom:2px solid #e2e8f0}
td{padding:10px 14px;border-bottom:1px solid #f1f1f1;font-size:.85rem}
tr:hover{background:#fafbfc}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:560px;width:92%;max-height:88vh;overflow-y:auto;position:relative}
.modal-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#888}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.9rem;position:fixed;top:70px;right:16px;z-index:9999;min-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.12);animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.alert-s{background:#d1fae5;color:#065f46;border-left:4px solid #10b981}
.alert-e{background:#fee2e2;color:#991b1b;border-left:4px solid #ef4444}
.alert-i{background:#dbeafe;color:#1e40af;border-left:4px solid #3b82f6}
.pbar{width:100%;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin:6px 0}
.pfill{height:100%;background:linear-gradient(90deg,#6c5ce7,#a855f7);transition:width .3s}
.side{width:240px;background:#fff;height:100vh;position:fixed;left:0;top:52px;padding:16px 0;box-shadow:2px 0 10px rgba(0,0,0,.06);overflow-y:auto;z-index:98}
.side ul{list-style:none}
.side li{padding:10px 20px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:10px;font-size:.88rem;border-left:3px solid transparent}
.side li:hover{background:#f8f9ff;color:#6c5ce7}
.side li.act{background:linear-gradient(90deg,#6c5ce7,#a855f7);color:#fff;border-left-color:#fff}
.main{margin-left:240px;padding:20px;min-height:calc(100vh - 52px)}
.notif{padding:12px;border-left:4px solid #6c5ce7;background:#f8f9ff;margin-bottom:8px;border-radius:8px;font-size:.85rem}
.notif.unread{background:#eff6ff;border-left-color:#2563eb}
.stars{display:inline-flex;gap:2px}
.star{cursor:pointer;font-size:1.3rem;color:#e2e8f0;transition:.2s}
.star.on,.star:hover{color:#fbbf24}
.sf{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sf input,.sf select{flex:1;min-width:160px}
.empty{text-align:center;padding:40px 20px;color:#999}
.empty i{font-size:3rem;margin-bottom:12px;opacity:.4}
.cert{background:linear-gradient(135deg,#fefce8,#fffbeb,#fff);border:16px solid #d4af37;border-radius:10px;padding:40px;max-width:800px;margin:20px auto;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.cert::before{content:'';position:absolute;top:-8px;left:-8px;right:-8px;bottom:-8px;border:2px solid #d4af37;border-radius:10px;pointer-events:none}
.cert-h{text-align:center;margin-bottom:24px}
.cert-logo{font-size:1.6rem;font-weight:800;color:#6c5ce7;margin-bottom:8px}
.cert-t{font-size:2rem;font-weight:700;color:#1a1a2e;margin-bottom:6px}
.cert-sub{font-size:1.1rem;color:#666}
.cert-body{text-align:center;margin:24px 0}
.cert-name{font-size:1.8rem;font-weight:700;color:#6c5ce7;margin:12px 0;border-bottom:2px solid #d4af37;display:inline-block;padding-bottom:6px}
.cert-course{font-size:1.3rem;color:#333;margin:10px 0}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:32px;padding-top:20px;border-top:2px solid #d4af37}
.cert-sig{text-align:center;min-width:180px}
.cert-sig-n{font-weight:700;font-size:1rem;margin-bottom:2px}
.cert-sig-t{color:#777;font-size:.8rem}
.cert-id{text-align:center;margin-top:16px;color:#999;font-size:.8rem}
.mob-tog{display:none;background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer}
.lesson-content{max-width:900px;margin:0 auto}
.video-wrap{width:100%;max-width:800px;margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
.video-wrap video,.video-wrap iframe{width:100%;aspect-ratio:16/9;display:block}
.audio-wrap{max-width:600px;margin:20px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.audio-wrap audio{width:100%}
.text-wrap{max-width:800px;margin:0 auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);line-height:1.8;white-space:pre-wrap}
.pdf-wrap{max-width:800px;margin:0 auto;text-align:center}
.pdf-wrap iframe{width:100%;height:600px;border:none;border-radius:10px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e2e8f0;overflow-x:auto}
.tab{padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;font-size:.88rem}
.tab.act{border-bottom-color:#6c5ce7;color:#6c5ce7;font-weight:600}

.lesson-layout{display:flex;min-height:calc(100vh - 52px)}
.lesson-side{width:280px;flex-shrink:0;height:calc(100vh - 52px);position:sticky;top:52px;z-index:50;background:#fff;border-right:1px solid #eee;overflow-y:auto;padding:12px}

@media(max-width:768px){
  .side{transform:translateX(-100%);transition:.3s;top:0;padding-top:60px}
  .side.open{transform:translateX(0)}
  .main{margin-left:0;padding:12px}
  .grid2,.grid3{grid-template-columns:1fr}
  .mob-tog{display:block}
  .nav{display:none}
  .nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:#6c5ce7;padding:12px;gap:10px}
  .cert{padding:16px}
  .cert-t{font-size:1.1rem}
  .cert-name{font-size:1rem}
  .cert-foot{flex-direction:column;gap:12px;align-items:center}
  .lesson-layout { flex-direction: column !important; }
  .lesson-side { width: 100% !important; position: relative !important; top: 0 !important; border-right: none !important; border-bottom: 1px solid #eee !important; max-height: 250px !important; height: auto !important; flex-shrink: 0 !important; }
  #lessonArea { padding: 12px !important; width: 100% !important; }
  .lesson-content { max-width: 100% !important; }
  .video-wrap, .audio-wrap, .text-wrap, .pdf-wrap { max-width: 100% !important; }
  .text-wrap { padding: 16px !important; }
  .grid-3-col, .grid-aff-mobile { grid-template-columns: 1fr !important; }
  .course-detail-grid { grid-template-columns: 1fr !important; }
  .card { padding: 16px !important; }
  .sf { flex-direction: column; }
  .sf input, .sf select { width: 100%; min-width: 100%; }
  .btn { width: 100%; justify-content: center; }
  .btn-sm { width: auto; }
}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, query, where, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBPBmbaJkwxcVaav48L8142japNjA7tn20",
    authDomain: "nova-reach-f5beb.firebaseapp.com",
    projectId: "nova-reach-f5beb",
    storageBucket: "nova-reach-f5beb.firebasestorage.app",
    messagingSenderId: "502299817600",
    appId: "1:502299817600:web:7c4ad689756967e54cd865",
    measurementId: "G-G1YMFZ4NNC"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.db = db;
  window.auth = auth;

  window.APP_DATA = {
    users: [], courses: [], lessons: [], enrollments: [], payments: [],
    wallets: [], certificates: [], notifications: [], affiliateLinks: [],
    affiliateSales: [], reviews: [], questions: [], answers: [],
    announcements: [], activityLogs: [], ads: [],
    settings: {platformName:'NOVA REACH ACADÉMIE',commission:10,currencies:['HTG','USD','EUR'],moncash:{number:'',name:''},natcash:{number:'33461451',name:'Darlene George'},contactEmail:'info@novareach.com'}
  };

  async function fetchCollection(name) {
    const snap = await getDocs(collection(db, name));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  window.refreshData = async function() {
    const [users, courses, lessons, enrollments, payments, wallets, certificates, notifications, affiliateLinks, affiliateSales, reviews, questions, answers, announcements, activityLogs, ads, settingsDocs] = await Promise.all([
      fetchCollection('users'), fetchCollection('courses'), fetchCollection('lessons'),
      fetchCollection('enrollments'), fetchCollection('payments'), fetchCollection('wallets'),
      fetchCollection('certificates'), fetchCollection('notifications'), fetchCollection('affiliateLinks'),
      fetchCollection('affiliateSales'), fetchCollection('reviews'), fetchCollection('questions'),
      fetchCollection('answers'), fetchCollection('announcements'), fetchCollection('activityLogs'),
      fetchCollection('ads'), fetchCollection('settings')
    ]);
    window.APP_DATA.users = users;
    window.APP_DATA.courses = courses;
    window.APP_DATA.lessons = lessons;
    window.APP_DATA.enrollments = enrollments;
    window.APP_DATA.payments = payments;
    window.APP_DATA.wallets = wallets;
    window.APP_DATA.certificates = certificates;
    window.APP_DATA.notifications = notifications;
    window.APP_DATA.affiliateLinks = affiliateLinks;
    window.APP_DATA.affiliateSales = affiliateSales;
    window.APP_DATA.reviews = reviews;
    window.APP_DATA.questions = questions;
    window.APP_DATA.answers = answers;
    window.APP_DATA.announcements = announcements;
    window.APP_DATA.activityLogs = activityLogs;
    window.APP_DATA.ads = ads;
    window.APP_DATA.settings = settingsDocs[0] || {platformName:'NOVA REACH ACADÉMIE',commission:10,currencies:['HTG','USD','EUR'],moncash:{number:'',name:''},natcash:{number:'33461451',name:'Darlene George'},contactEmail:'info@novareach.com'};
    
    if(!window.APP_DATA.settings.platformName) {
        window.APP_DATA.settings = {platformName:'NOVA REACH ACADÉMIE',commission:10,currencies:['HTG','USD','EUR'],moncash:{number:'',name:''},natcash:{number:'33461451',name:'Darlene George'},contactEmail:'info@novareach.com'};
        await setDoc(doc(db, 'settings', 'global'), window.APP_DATA.settings);
    }
  };

  window.getDB = function() { return window.APP_DATA; };

  window.addDocToDB = async function(col, data) {
    if(!data.id) data.id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    await addDoc(collection(db, col), data);
    if(window.APP_DATA[col]) window.APP_DATA[col].push(data);
    return data.id;
  };

  window.updateDocInDB = async function(col, id, data) {
    await updateDoc(doc(db, col, id), data);
    if(window.APP_DATA[col]) {
        let idx = window.APP_DATA[col].findIndex(x => x.id === id);
        if(idx !== -1) window.APP_DATA[col][idx] = { ...window.APP_DATA[col][idx], ...data };
    }
  };

  window.deleteDocFromDB = async function(col, id) {
    await deleteDoc(doc(db, col, id));
    if(window.APP_DATA[col]) {
        window.APP_DATA[col] = window.APP_DATA[col].filter(x => x.id !== id);
    }
  };

  // --- AUTH & HELPERS ---
  const SESS_KEY='nova_sess';
  window.setSession = function(uid2,role){let s={uid:uid2,role,ts:Date.now()};localStorage.setItem(SESS_KEY,JSON.stringify(s));return s}
  window.getSession = function(){let s=localStorage.getItem(SESS_KEY);if(!s)return null;try{return JSON.parse(s)}catch{return null}}
  window.clearSession = function(){localStorage.removeItem(SESS_KEY)}
  window.currentUser = function(){let s=getSession();if(!s)return null;return window.APP_DATA.users.find(u=>u.id===s.uid)||null}
  window.isAdmin = function(){let u=currentUser();return u&&u.role==='admin'}
  window.isTeacher = function(){let u=currentUser();return u&&u.role==='teacher'}
  window.isStudent = function(){let u=currentUser();return u&&u.role==='student'}

  window.alert2 = function(msg,type='s'){let el=document.createElement('div');el.className='alert alert-'+type;el.innerHTML='<i class="fas fa-'+(type==='s'?'check-circle':type==='e'?'exclamation-circle':'info-circle')+'"></i> '+msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
  window.fmtCur = function(a,c){let s={HTG:'HTG',USD:'$',EUR:'€'};let num=parseFloat(a)||0;return c==='USD'||c==='EUR'?(s[c]||c)+' '+num.toFixed(2):num.toFixed(2)+' '+(s[c]||c)}
  window.fmtDate = function(d){if(!d)return'-';return new Date(d).toLocaleDateString('fr-FR',{year:'numeric',month:'short',day:'numeric'})}
  window.fmtDT = function(d){if(!d)return'-';return new Date(d).toLocaleString('fr-FR')}
  window.starsH = function(r){let h='';for(let i=1;i<=5;i++)h+='<i class="fas fa-star star'+(i<=Math.round(r)?' on':'')+'"></i>';return h}
  window.statusB = function(s){let m={pending:'sbp',approved:'sba',rejected:'sbr',draft:'sbd',pending_review:'sbp',published:'sba',unpublished:'sbp2',archived:'sbd',active:'sba',suspended:'sbr'};return'<span class="badge '+(m[s]||'sbd')+'">'+s+'</span>'}
  window.esc = function(s){if(!s)return'';let d=document.createElement('div');d.textContent=s;return d.innerHTML}
  window.uid = function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  window.certId = function(){return 'NRA-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
  window.affCode = function(){return 'AFF-'+Math.random().toString(36).slice(2,10).toUpperCase()}

  window.nav = function(p){window.location.hash=p}
  window.getRoute = function(){return window.location.hash.slice(1)||'/'}
  
  window.route = async function(){
    let p=getRoute(),u=currentUser();
    if(p.startsWith('/admin')&&p!=='/admin-login'){if(!isAdmin()){nav('/admin-login');return}}
    if(p.startsWith('/student')&&!isStudent()){nav(u?'/login':'/login');return}
    if(p.startsWith('/teacher')&&!isTeacher()){nav(u?'/login':'/login');return}
    window.render(p);
  }
  window.addEventListener('hashchange', window.route);
  window.addEventListener('load', async () => {
      await window.refreshData();
      window.route();
  });

  // --- RENDER ENGINE (Simplified for brevity, keeping core logic) ---
  window.render = function(p){
    let app=document.getElementById('app');
    let u=currentUser();
    if(p==='/'||p==='')return window.renderHome(app,u);
    if(p==='/login')return window.renderLogin(app);
    if(p==='/register')return window.renderRegister(app);
    if(p==='/admin-login')return window.renderAdminLogin(app);
    if(p==='/admin')return window.renderAdmin(app);
    if(p==='/student')return window.renderStudentDash(app);
    if(p==='/teacher')return window.renderTeacherDash(app);
    if(p==='/courses')return window.renderCourses(app,u);
    if(p.startsWith('/course/'))return window.renderCourseDetail(app,p,u);
    if(p.startsWith('/learn/'))return window.renderLearn(app,p,u);
    if(p==='/profile')return window.renderProfile(app,u);
    if(p==='/verify-cert')return window.renderVerifyCert(app);
    if(p.startsWith('/certificate/'))return window.renderCertView(app,p,u);
    if(p==='/teacher/create')return window.renderCreateCourse(app,u);
    if(p.startsWith('/teacher/edit/'))return window.renderEditCourse(app,p,u);
    if(p.startsWith('/teacher/wallet'))return window.renderWallet(app,u);
    if(p.startsWith('/teacher/affiliates'))return window.renderAffiliates(app,u);
    if(p.startsWith('/student/payments'))return window.renderStudentPayments(app,u);
    if(p.startsWith('/student/certificates'))return window.renderStudentCerts(app,u);
    if(p.startsWith('/student/notifications'))return window.renderStudentNotifs(app,u);
    if(p.startsWith('/teacher/notifications'))return window.renderTeacherNotifs(app,u);
    if(p.startsWith('/payment/'))return window.renderPaymentPage(app,p,u);
    if(p.startsWith('/teacher/profile/'))return window.renderPublicProfile(app,p);
    window.renderHome(app,u);
  }

  window.headerH = function(u){
    return`<header class="hdr"><div class="hdr-inner"><div class="logo" onclick="nav('/')"><i class="fas fa-graduation-cap"></i>NOVA REACH ACADÉMIE</div><button class="mob-tog" onclick="document.querySelector('.nav').classList.toggle('open')"><i class="fas fa-bars"></i></button><nav class="nav">${u?`<a href="#/${u.role}">Dashboard</a><a href="#/courses">Courses</a><a href="#/profile">Profile</a><a href="#" onclick="window.doLogout();return false">Logout</a>`:`<a href="#/login">Login</a><a href="#/register">Register</a><a href="#/courses">Courses</a>`}<span class="lock-icon" onclick="nav('/admin-login')" title="Admin"><i class="fas fa-lock"></i></span></nav></div></header>`
  }
  window.doLogout = async function(){
      try { await signOut(auth); } catch(e){}
      window.clearSession();
      nav('/');
      window.alert2('Déconnecté','s');
  }

  window.renderHome = function(app,u){
    let d=getDB();let courses=d.courses.filter(c=>c.status==='published');

  window.renderLogin = function(app){

  window.doLogin = async function(e){
    e.preventDefault();
    let email=document.getElementById('lEmail').value.trim(),pass=document.getElementById('lPass').value;
    if(email === 'admin@novareach.com' && pass === '__admin__') {
        window.setSession('admin_local', 'admin');
        window.alert2('Connecté avec succès', 's');
        nav('/admin');
        return;
    }
    try {
        let userDoc = window.APP_DATA.users.find(u => u.email === email);
        if(!userDoc) { window.alert2('Email ou mot de passe incorrect', 'e'); return; }
        if(userDoc.status === 'suspended') { window.alert2('Compte suspendu', 'e'); return; }
        
        try { await signInWithEmailAndPassword(auth, email, pass); } 
        catch (authError) { if(userDoc.password !== pass) { window.alert2('Email ou mot de passe incorrect', 'e'); return; } }
        
        window.setSession(userDoc.id, userDoc.role);
        window.alert2('Connecté avec succès', 's');
        nav('/' + userDoc.role);
    } catch (err) { window.alert2('Erreur: ' + err.message, 'e'); }
  }

  window.doRegister = async function(e){
    e.preventDefault();
    let role=document.getElementById('rRole').value,name=document.getElementById('rName').value.trim(),email=document.getElementById('rEmail').value.trim(),phone=document.getElementById('rPhone').value.trim(),pass=document.getElementById('rPass').value;
    if(window.APP_DATA.users.find(u=>u.email===email)) return window.alert2('Cet email existe déjà','e');
    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        let uid = userCredential.user.uid;
        let u = {id:uid, role, name, email, password:pass, status:'active', phone, profilePhoto:'', bio:'', createdAt:new Date().toISOString()};

        window.alert2('Compte créé avec succès','s');

  }

  window.filterCourses = function(){
    let q=(document.getElementById('searchQ').value||'').toLowerCase(),type=document.getElementById('fType').value,cat=document.getElementById('fCat').value;
    let d=getDB();let cs=d.courses.filter(c=>c.status==='published');
    if(q)cs=cs.filter(c=>c.title.toLowerCase().includes(q)||(c.description||'').toLowerCase().includes(q));
    if(type)cs=cs.filter(c=>c.accessType===type);
    if(cat)cs=cs.filter(c=>(c.category||'')===cat);
    document.getElementById('coursesGrid').innerHTML=cs.length?cs.map(c=>window.courseCardH(c,d)).join(''):'<div class="empty"><i class="fas fa-search"></i><p>Aucun cours trouvé</p></div>';
  }

  window.enrollFree = async function(cid){
    let u=currentUser();if(!u)return;
    if(window.APP_DATA.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid)) return window.alert2('Déjà inscrit','e');
    let enrId = await window.addDocToDB('enrollments', {studentId:u.id,courseId:cid,progress:0,completedLessons:[],lastLessonId:null,completed:false,enrolledAt:new Date().toISOString()});
    let c = window.APP_DATA.courses.find(x=>x.id===cid);
    if(c) await window.updateDocInDB('courses', c.id, {studentsCount: (c.studentsCount||0)+1});
    window.alert2('Inscription réussie!','s');nav('/learn/'+cid);
  }

  window.renderLearn = function(app,p,u){
    if(!u||u.role!=='student'){nav('/login');return}
    let cid=p.split('/')[2];let d=getDB();let c=d.courses.find(x=>x.id===cid);
    let enr=d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid);
    if(!c){nav('/student');return}
    if(c.accessType==='paid'&&!enr){nav('/course/'+cid);return}
    if(c.accessType==='free'&&!enr){
      await window.addDocToDB('enrollments', {studentId:u.id,courseId:cid,progress:0,completedLessons:[],lastLessonId:null,completed:false,enrolledAt:new Date().toISOString()});
      let cc=d.courses.find(x=>x.id===cid);if(cc)await window.updateDocInDB('courses', cc.id, {studentsCount:(cc.studentsCount||0)+1});
      enr = d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid);
    }
    let lessons=d.lessons.filter(l=>l.courseId===cid);
    if(!lessons.length){app.innerHTML=headerH(u)+'<div class="container" style="padding:40px"><div class="empty"><i class="fas fa-book"></i><p>Aucune leçon disponible</p></div></div>';return}
    let currentL=enr.lastLessonId?lessons.find(l=>l.id===enr.lastLessonId):lessons[0];
    if(!currentL)currentL=lessons[0];
    let pct=lessons.length?Math.round((enr.completedLessons.length/lessons.length)*100):0;
    app.innerHTML=headerH(u)+`<div class="lesson-layout"><div class="lesson-side"><h3 style="font-size:.95rem;margin-bottom:8px">${window.esc(c.title)}</h3><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><p style="font-size:.75rem;color:#888;margin-bottom:12px">${enr.completedLessons.length}/${lessons.length} leçons (${pct}%)</p>${lessons.map((l,i)=>{let done=enr.completedLessons.includes(l.id);let active=currentL.id===l.id;return`<div onclick="window.loadLesson('${l.id}','${cid}')" style="padding:8px;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:.82rem;${active?'background:#6c5ce7;color:#fff':'background:'+(done?'#f0fdf4':'#f9f9f9')}"><i class="fas fa-${done?'check-circle':'circle'}" style="margin-right:6px"></i>${i+1}. ${window.esc(l.title)} <span style="font-size:.7rem;opacity:.7">${l.type.toUpperCase()}</span></div>`}).join('')}</div><div style="flex:1;padding:20px;overflow-y:auto" id="lessonArea">${window.renderLessonContent(currentL,enr)}</div></div>`
  }

  window.renderLessonContent = function(l,enr){
    let done=enr.completedLessons.includes(l.id);
    let content='';
    if(l.type==='video'){
      if(l.content.includes('youtube')||l.content.includes('youtu.be')) content=`<div class="video-wrap"><iframe src="${l.content.includes('embed')?l.content:l.content.replace('watch?v=','embed/')}" frameborder="0" allowfullscreen></iframe></div>`;
      else content=`<div class="video-wrap"><video controls src="${window.esc(l.content)}">Votre navigateur ne supporte pas la vidéo</video></div>`;
    } else if(l.type==='audio') content=`<div class="audio-wrap"><h3 style="margin-bottom:12px"><i class="fas fa-headphones"></i> ${window.esc(l.title)}</h3><audio controls src="${window.esc(l.content)}"></audio></div>`;
    else if(l.type==='text') content=`<div class="text-wrap">${window.esc(l.content)}</div>`;
    else if(l.type==='pdf') content=`<div class="pdf-wrap"><h3 style="margin-bottom:12px"><i class="fas fa-file-pdf" style="color:#e74c3c"></i> ${window.esc(l.title)}</h3><iframe src="${window.esc(l.content)}"></iframe><br><a href="${window.esc(l.content)}" target="_blank" class="btn bs btn-sm" style="margin-top:8px"><i class="fas fa-download"></i> Télécharger</a></div>`;
    return`<div class="lesson-content"><h2 style="margin-bottom:16px">${window.esc(l.title)} <span class="badge sbd">${l.type.toUpperCase()}</span></h2>${content}<div style="margin-top:20px;display:flex;gap:12px;align-items:center">${done?'<span style="color:#10b981;font-weight:600"><i class="fas fa-check-circle"></i> Complétée</span>':`<button class="btn bg" onclick="window.markDone('${l.id}','${l.courseId}')"><i class="fas fa-check"></i> Marquer comme complétée</button>`}</div></div>`
  }

  window.loadLesson = function(lid,cid){
    let u=currentUser();let d=getDB();let l=d.lessons.find(x=>x.id===lid);let enr=d.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid);
    if(!l||!enr)return;
    window.updateDocInDB('enrollments', enr.id, {lastLessonId:lid});
    document.getElementById('lessonArea').innerHTML=window.renderLessonContent(l,enr);
    document.querySelectorAll('.lesson-side > div').forEach(el=>{el.style.background=el.getAttribute('onclick')?.includes(lid)?'#6c5ce7':'';if(el.getAttribute('onclick')?.includes(lid))el.style.color='#fff'});
  }

  window.markDone = async function(lid,cid){
    let u=currentUser();
    let enr=window.APP_DATA.enrollments.find(e=>e.studentId===u.id&&e.courseId===cid);
    if(!enr)return window.alert2('Non inscrit','e');
    if(!enr.completedLessons.includes(lid)) {
        enr.completedLessons.push(lid);
        await window.updateDocInDB('enrollments', enr.id, {completedLessons:enr.completedLessons});
    }
    let lessons=window.APP_DATA.lessons.filter(l=>l.courseId===cid);
    enr.progress=Math.round((enr.completedLessons.length/lessons.length)*100);
    await window.updateDocInDB('enrollments', enr.id, {progress:enr.progress});
    if(enr.completedLessons.length>=lessons.length&&!enr.completed){
      enr.completed=true;
      await window.updateDocInDB('enrollments', enr.id, {completed:true});
      let c=window.APP_DATA.courses.find(x=>x.id===cid);let s=window.APP_DATA.users.find(x=>x.id===u.id);
      let certData={id:window.uid(),certificateId:window.certId(),studentId:u.id,courseId:cid,studentName:s?s.name:'',courseName:c?c.title:'',issuedAt:new Date().toISOString()};
      await window.addDocToDB('certificates', certData);
      await window.addDocToDB('notifications', {id:window.uid(),userId:u.id,type:'certificate',title:'Certificat obtenu!',message:'Félicitations! Vous avez terminé "'+certData.courseName+'".',read:false,createdAt:new Date().toISOString()});
      if(c) await window.addDocToDB('notifications', {id:window.uid(),userId:c.teacherId,type:'course_completed',title:'Cours terminé',message:u.name+' a terminé "'+c.title+'"',read:false,createdAt:new Date().toISOString()});
    }
    await window.updateDocInDB('enrollments', enr.id, {lastLessonId:lid});
    window.alert2(enr.completed?'Félicitations! Cours terminé! 🎉':'Leçon complétée!','s');
    window.renderLearn(document.getElementById('app'),'/learn/'+cid,u);
  }

  window.renderCreateCourse = function(app,u){
    if(!u||u.role!=='teacher'){nav('/login');return}
    app.innerHTML=headerH(u)+`<div class="container" style="max-width:700px;margin:24px auto"><div class="card"><h2 class="card-t">Créer une formation</h2><form onsubmit="window.saveCourse(event,null)"><div class="fg"><label>Titre</label><input type="text" class="fc" id="cTitle" required></div><div class="fg"><label>Description</label><textarea class="fc" id="cDesc" required></textarea></div><div class="fg"><label>Catégorie</label><select class="fc" id="cCat"><option>Marketing</option><option>Programmation</option><option>Design</option><option>Business</option><option>Langues</option><option>Autre</option></select></div><div class="fg"><label>Miniature (URL ou Fichier)</label><input type="file" id="cThumbFile" accept="image/*" onchange="window.handleThumbUpload(this)" style="margin-bottom:8px"><input type="text" class="fc" id="cThumb" placeholder="https://..."></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px" class="grid-3-col"><div class="fg"><label>Accès</label><select class="fc" id="cAccess"><option value="free">Gratuit</option><option value="paid">Payant</option></select></div><div class="fg"><label>Prix</label><input type="number" class="fc" id="cPrice" value="0" min="0"></div><div class="fg"><label>Devise</label><select class="fc" id="cCur"><option>USD</option><option>HTG</option><option>EUR</option></select></div></div><button type="submit" class="btn bp" style="width:100%">Créer le cours</button></form></div></div>`
  }

  window.renderEditCourse = function(app,p,u){
    if(!u||u.role!=='teacher'){nav('/login');return}
    let cid=p.split('/')[3];let d=getDB();let c=d.courses.find(x=>x.id===cid);
    if(!c||c.teacherId!==u.id){nav('/teacher');return}
    let lessons=d.lessons.filter(l=>l.courseId===cid);
    app.innerHTML=headerH(u)+`<div class="container" style="max-width:800px;margin:24px auto"><div class="card"><h2 class="card-t">Modifier: ${window.esc(c.title)}</h2><form onsubmit="window.saveCourse(event,'${cid}')"><div class="fg"><label>Titre</label><input type="text" class="fc" id="cTitle" value="${window.esc(c.title)}" required></div><div class="fg"><label>Description</label><textarea class="fc" id="cDesc" required>${window.esc(c.description)}</textarea></div><div class="fg"><label>Catégorie</label><select class="fc" id="cCat"><option ${c.category==='Marketing'?'selected':''}>Marketing</option><option ${c.category==='Programmation'?'selected':''}>Programmation</option><option ${c.category==='Design'?'selected':''}>Design</option><option ${c.category==='Business'?'selected':''}>Business</option><option ${c.category==='Langues'?'selected':''}>Langues</option><option ${c.category==='Autre'?'selected':''}>Autre</option></select></div><div class="fg"><label>Miniature</label><input type="file" id="cThumbFile" accept="image/*" onchange="window.handleThumbUpload(this)" style="margin-bottom:8px"><input type="text" class="fc" id="cThumb" value="${window.esc(c.thumbnail||'')}"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px" class="grid-3-col"><div class="fg"><label>Accès</label><select class="fc" id="cAccess"><option value="free" ${c.accessType==='free'?'selected':''}>Gratuit</option><option value="paid" ${c.accessType==='paid'?'selected':''}>Payant</option></select></div><div class="fg"><label>Prix</label><input type="number" class="fc" id="cPrice" value="${c.price||0}" min="0"></div><div class="fg"><label>Devise</label><select class="fc" id="cCur"><option ${c.currency==='USD'?'selected':''}>USD</option><option ${c.currency==='HTG'?'selected':''}>HTG</option><option ${c.currency==='EUR'?'selected':''}>EUR</option></select></div></div><button type="submit" class="btn bp" style="width:100%">Sauvegarder</button></form><hr style="margin:24px 0"><h3>Leçons (${lessons.length})</h3><div id="lessonsList">${lessons.map((l,i)=>`<div style="padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><strong>${i+1}. ${window.esc(l.title)}</strong> <span class="badge sbd">${l.type.toUpperCase()}</span></div><button class="btn bd btn-sm" onclick="window.deleteLesson('${l.id}','${cid}')"><i class="fas fa-trash"></i></button></div>`).join('')||'<p style="color:#999">Aucune leçon</p>'}</div>
    <div class="card" style="margin-top:16px;background:#f8f9ff"><h4 style="margin-bottom:12px">Ajouter une leçon</h4><div class="fg"><label>Titre</label><input type="text" class="fc" id="lTitle"></div><div class="fg"><label>Type</label><select class="fc" id="lType" onchange="window.toggleLContent()"><option value="video">Vidéo</option><option value="audio">Audio</option><option value="text">Texte</option><option value="pdf">PDF</option></select></div><div class="fg" id="lContentWrap"><label id="lContentLabel">URL ou Fichier</label><textarea class="fc" id="lContent" placeholder="URL..."></textarea><input type="file" id="lFile" accept="video/*" style="margin-top:8px" onchange="window.handleFileUpload(this)"></div><button class="btn bg" onclick="window.addLesson('${cid}')"><i class="fas fa-plus"></i> Ajouter</button></div>
    <hr style="margin:24px 0"><div style="display:flex;gap:8px;flex-wrap:wrap">${c.status==='draft'||c.status==='rejected'?`<button class="btn bw" onclick="window.submitCourse('${cid}')">Soumettre pour révision</button>`:''}${c.status==='published'?`<span class="badge sba">Publié</span>`:''}${window.statusB(c.status)}</div></div></div>`
  }

  window.handleThumbUpload = function(input){
    let file=input.files[0]; if(!file)return;
    if(file.size > 2 * 1024 * 1024){ window.alert2('Image trop volumineuse! Max 2MB.','e'); input.value=''; return; }
    let reader=new FileReader();
    reader.onload=function(e){ document.getElementById('cThumb').value=e.target.result; window.alert2('Image chargée!','s'); };
    reader.readAsDataURL(file);
  }
  window.toggleLContent = function(){
    let t=document.getElementById('lType').value;
    let labels={video:'URL Vidéo ou Fichier',audio:'URL Audio ou Fichier',text:'Contenu texte',pdf:'URL PDF ou Fichier'};
    document.getElementById('lContentLabel').textContent=labels[t];
    let fileInput=document.getElementById('lFile');
    if(fileInput){
        if(t==='video') fileInput.accept='video/*';
        else if(t==='audio') fileInput.accept='audio/*';
        else if(t==='pdf') fileInput.accept='application/pdf,.pdf';
        fileInput.style.display = t==='text' ? 'none' : 'block';
    }
  }
  window.handleFileUpload = function(input){
    let file=input.files[0]; if(!file)return;
    if(file.size > 2 * 1024 * 1024){ window.alert2('Fichier trop volumineux! Max 2MB.','e'); input.value=''; return; }
    let reader=new FileReader();
    reader.onload=function(e){ document.getElementById('lContent').value=e.target.result; window.alert2('Fichier chargé! Cliquez sur "Ajouter".','s'); };
    reader.readAsDataURL(file);
  }

  window.addLesson = async function(cid){
    let title=document.getElementById('lTitle').value.trim(),type=document.getElementById('lType').value,content=document.getElementById('lContent').value.trim();
    if(!title||!content)return window.alert2('Remplissez tous les champs','e');
    await window.addDocToDB('lessons', {courseId:cid,title,type,content,isPreview:false,createdAt:new Date().toISOString()});
    window.alert2('Leçon ajoutée!','s');window.renderEditCourse(document.getElementById('app'),'/teacher/edit/'+cid,currentUser());
  }
  window.deleteLesson = async function(lid,cid){
    if(!confirm('Supprimer cette leçon?'))return;
    await window.deleteDocFromDB('lessons', lid);
    window.alert2('Leçon supprimée','s');window.renderEditCourse(document.getElementById('app'),'/teacher/edit/'+cid,currentUser());
  }
  window.saveCourse = async function(e,cid){
    e.preventDefault();let u=currentUser();
    let title=document.getElementById('cTitle').value.trim(),desc=document.getElementById('cDesc').value.trim(),cat=document.getElementById('cCat').value,thumb=document.getElementById('cThumb').value.trim(),access=document.getElementById('cAccess').value,price=parseFloat(document.getElementById('cPrice').value)||0,cur=document.getElementById('cCur').value;
    if(access==='paid'&&price<=0)return window.alert2('Un cours payant doit avoir un prix > 0','e');
    if(cid){
      await window.updateDocInDB('courses', cid, {title,description:desc,category:cat,thumbnail:thumb,accessType:access,price,currency:cur});
      window.alert2('Cours mis à jour!','s');
    }else{
      let newId = await window.addDocToDB('courses', {teacherId:u.id,title,description:desc,category:cat,thumbnail:thumb,accessType:access,price,currency:cur,status:'draft',rating:0,studentsCount:0,createdAt:new Date().toISOString()});
      cid = newId; window.alert2('Cours créé!','s');
    }
    nav('/teacher/edit/'+cid);
  }
  window.submitCourse = async function(cid){
    let d=getDB();let c=d.courses.find(x=>x.id===cid);
    let lessons=d.lessons.filter(l=>l.courseId===cid);
    if(!lessons.length)return window.alert2('Ajoutez au moins une leçon avant de soumettre','e');
    if(c.accessType==='paid'&&(!c.price||c.price<=0))return window.alert2('Définissez un prix valide','e');
    await window.updateDocInDB('courses', cid, {status:'pending_review'});
    window.alert2('Cours soumis pour révision!','s');
    window.renderEditCourse(document.getElementById('app'),'/teacher/edit/'+cid,currentUser());
  }

  // --- ADMIN FUNCTIONS ---
  window.renderAdmin = function(app){
    if(!isAdmin()){nav('/admin-login');return}
    app.innerHTML=headerH(currentUser())+`<button class="mob-tog" style="display:none;position:fixed;bottom:16px;right:16px;z-index:200;background:#6c5ce7;color:#fff;width:48px;height:48px;border-radius:50%;font-size:1.2rem;border:none;cursor:pointer" onclick="document.querySelector('.side').classList.toggle('open')"><i class="fas fa-bars"></i></button><div class="side" id="adminSide"><ul><li class="act" data-s="dash" onclick="window.adminTab(this,'dash')"><i class="fas fa-tachometer-alt"></i> Dashboard</li><li data-s="students" onclick="window.adminTab(this,'students')"><i class="fas fa-user-graduate"></i> Étudiants</li><li data-s="teachers" onclick="window.adminTab(this,'teachers')"><i class="fas fa-chalkboard-teacher"></i> Formateurs</li><li data-s="courses" onclick="window.adminTab(this,'courses')"><i class="fas fa-book"></i> Tous les cours</li><li data-s="payments" onclick="window.adminTab(this,'payments')"><i class="fas fa-credit-card"></i> Paiements</li><li data-s="settings" onclick="window.adminTab(this,'settings')"><i class="fas fa-cog"></i> Paramètres</li><li onclick="window.doLogout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</li></ul></div><div class="main" id="adminMain"></div><style>@media(max-width:768px){.mob-tog{display:block!important}}</style>`;
    window.adminLoadDash();
  }
  window.adminTab = function(el,tab){
    document.querySelectorAll('.side li').forEach(l=>l.classList.remove('act'));el.classList.add('act');
    if(tab==='dash')window.adminLoadDash();
    else if(tab==='students')window.adminLoadStudents();
    else if(tab==='teachers')window.adminLoadTeachers();
    else if(tab==='courses')window.adminLoadCourses();
    else if(tab==='payments')window.adminLoadPayments();
    else if(tab==='settings')window.adminLoadSettings();
    document.querySelector('.side')?.classList.remove('open');
  }

  window.adminLoadDash = async function(){
    await window.refreshData(); // Ensure fresh data
    let d=getDB();let m=document.getElementById('adminMain');
    let students=d.users.filter(u=>u.role==='student'),teachers=d.users.filter(u=>u.role==='teacher');
    let courses=d.courses,pays=d.payments,enrs=d.enrollments,certs=d.certificates;
    let revenueHTG = pays.filter(p=>p.status==='approved' && p.currency==='HTG').reduce((s,p)=>s+parseFloat(p.amount||0),0);
    let revenueUSD = pays.filter(p=>p.status==='approved' && p.currency==='USD').reduce((s,p)=>s+parseFloat(p.amount||0),0);
    let revenueEUR = pays.filter(p=>p.status==='approved' && p.currency==='EUR').reduce((s,p)=>s+parseFloat(p.amount||0),0);

    m.innerHTML=`<h1 style="margin-bottom:16px">Tableau de bord Admin</h1>
    <div class="grid3">
      <div class="scard"><div class="sicon b"><i class="fas fa-user-graduate"></i></div><div class="sinfo"><h3>${students.length}</h3><p>Étudiants</p></div></div>
      <div class="scard"><div class="sicon g"><i class="fas fa-chalkboard-teacher"></i></div><div class="sinfo"><h3>${teachers.length}</h3><p>Formateurs</p></div></div>
      <div class="scard"><div class="sicon p"><i class="fas fa-book"></i></div><div class="sinfo"><h3>${courses.length}</h3><p>Cours</p></div></div>
      <div class="scard"><div class="sicon g"><i class="fas fa-dollar-sign"></i></div><div class="sinfo"><h3>${window.fmtCur(revenueUSD,'USD')}</h3><p>Revenus (USD)</p></div></div>
      <div class="scard"><div class="sicon b"><i class="fas fa-money-bill-wave"></i></div><div class="sinfo"><h3>${window.fmtCur(revenueHTG,'HTG')}</h3><p>Revenus (HTG)</p></div></div>
      <div class="scard"><div class="sicon p"><i class="fas fa-euro-sign"></i></div><div class="sinfo"><h3>${window.fmtCur(revenueEUR,'EUR')}</h3><p>Revenus (EUR)</p></div></div>
    </div>`;
  }

  window.adminLoadTeachers = async function(){
    await window.refreshData();
    let d=getDB();let m=document.getElementById('adminMain');
    let teachers=d.users.filter(u=>u.role==='teacher');
    console.log("DEBUG: Teachers found:", teachers);
    m.innerHTML=`<h1 style="margin-bottom:16px">Formateurs (${teachers.length})</h1>
    <div class="tbl-wrap"><table><thead><tr><th>Nom</th><th>Email</th><th>Statut</th><th>Actions</th></tr></thead>
    <tbody>${teachers.length?teachers.map(t=>`<tr><td>${window.esc(t.name)}</td><td>${window.esc(t.email)}</td><td>${window.statusB(t.status)}</td><td><button class="btn bs btn-sm" onclick="window.toggleStatus('${t.id}')">${t.status==='active'?'Suspendre':'Activer'}</button></td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center;color:#999">Aucun formateur. Vérifiez la console (F12) pour le debug.</td></tr>'}</tbody></table></div>`;
  }

  window.toggleStatus = async function(uid2){
    let u=window.APP_DATA.users.find(x=>x.id===uid2);
    if(u) await window.updateDocInDB('users', uid2, {status: u.status==='active'?'suspended':'active'});
    window.alert2('Statut mis à jour','s');window.adminLoadTeachers();
  }

  window.adminLoadCourses = async function(){
    await window.refreshData();
    let d=getDB();let m=document.getElementById('adminMain');
    m.innerHTML=`<h1 style="margin-bottom:16px">Tous les cours</h1><div class="tbl-wrap"><table><thead><tr><th>Titre</th><th>Formateur</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${d.courses.length?d.courses.map(c=>{let t=d.users.find(u=>u.id===c.teacherId);return`<tr><td>${window.esc(c.title)}</td><td>${t?window.esc(t.name):'-'}</td><td>${window.statusB(c.status)}</td><td>${c.status==='pending_review'?`<button class="btn bg btn-sm" onclick="window.adminApproveCourse('${c.id}')">Approuver</button><button class="btn bd btn-sm" onclick="window.adminRejectCourse('${c.id}')">Rejeter</button>`:''}${c.status==='approved'?`<button class="btn bp btn-sm" onclick="window.adminPublishCourse('${c.id}')">Publier</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="4" style="text-align:center;color:#999">Aucun cours</td></tr>'}</tbody></table></div>`;
  }
  window.adminApproveCourse = async function(cid){ await window.updateDocInDB('courses', cid, {status:'approved'}); window.alert2('Approuvé','s'); window.adminLoadCourses(); }
  window.adminRejectCourse = async function(cid){ await window.updateDocInDB('courses', cid, {status:'rejected'}); window.alert2('Rejeté','s'); window.adminLoadCourses(); }
  window.adminPublishCourse = async function(cid){ await window.updateDocInDB('courses', cid, {status:'published'}); window.alert2('Publié','s'); window.adminLoadCourses(); }

  // Initial call to ensure data is loaded on first paint if hash is empty
  if(!window.location.hash) window.refreshData();
</script>
